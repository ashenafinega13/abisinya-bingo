<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AbisinyaBingo Bot - Game Over</title>
    <style>
        body {
            background-color: #0d1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #ffffff;
        }

        .game-over-modal {
            background-color: #131b2e;
            border: 2px solid #ffd700;
            border-radius: 15px;
            width: 380px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            position: relative;
        }

        .game-over-title {
            color: #ffd700;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        /* የአሸናፊው ስም ማሳያ */
        .winner-badge {
            background-color: #e63946;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px; /* ፊደሉ ትንሽ አድርገነዋል */
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            width: 90%;
        }

        .prize-section {
            background-color: #0d1625;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #1f2a3f;
        }

        .prize-label {
            color: #8b9bb4;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .prize-amount {
            color: #00b4d8;
            font-size: 22px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Bingo Board Grid */
        .bingo-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-bottom: 15px;
        }

        .bingo-header {
            background-color: #1f2a3f;
            color: #fff;
            font-weight: bold;
            padding: 8px;
            border-radius: 5px;
            font-size: 14px;
        }

        .bingo-header.b { background-color: #0077b6; }
        .bingo-header.i { background-color: #0096c7; }
        .bingo-header.n { background-color: #03045e; }
        .bingo-header.g { background-color: #f77f00; }
        .bingo-header.o { background-color: #d62828; }

        .bingo-cell {
            background-color: #1f2a3f;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 40px;
            color: #e0e0e0;
            transition: background-color 0.3s;
        }

        /* የተመረጡ ቁጥሮች (Marked) */
        .bingo-cell.marked {
            background-color: #2a9d8f;
            color: #ffffff;
            border: 1px solid #264653;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }

        /* አሸናፊ የሆኑ ማዕዘኖች (Winning Cells) */
        .bingo-cell.winning-cell {
            background-color: #ffd700 !important; /* ቢጫ ቀለም ለማስገደድ */
            color: #000000 !important;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            border: 2px solid #fff;
        }

        /* Free Space */
        .bingo-cell.free-space {
            background-color: #2a9d8f;
            color: #ffffff;
            font-size: 12px;
        }

        .board-number {
            color: #8b9bb4;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .status-message {
            font-size: 13px;
            color: #00f5d4;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .countdown {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
        }
    </style>
</head>
<body>

<div class="game-over-modal">
    <div class="game-over-title">🏆 GAME OVER 🏆</div>
    
    <!-- 1ኛ ማሻሻያ: የአሸናፊው ስም በJavaScript እንዲመጣ ተደርጓል -->
    <div class="winner-badge" id="winnerNameDisplay">በመጫን ላይ...</div>

    <div class="prize-section">
        <div class="prize-label">PRIZE</div>
        <div class="prize-amount">8 ETB</div>
    </div>

    <!-- Bingo Board Grid -->
    <div class="bingo-board" id="bingoGrid">
        <div class="bingo-header b">B</div>
        <div class="bingo-header i">I</div>
        <div class="bingo-header n">N</div>
        <div class="bingo-header g">G</div>
        <div class="bingo-header o">O</div>

        <!-- Row 1 -->
        <div class="bingo-cell" id="cell-1">1</div>
        <div class="bingo-cell" id="cell-16">16</div>
        <div class="bingo-cell" id="cell-31">31</div>
        <div class="bingo-cell" id="cell-46">46</div>
        <div class="bingo-cell" id="cell-61">61</div>

        <!-- Row 2 -->
        <div class="bingo-cell" id="cell-8">8</div>
        <div class="bingo-cell" id="cell-23">23</div>
        <div class="bingo-cell" id="cell-38">38</div>
        <div class="bingo-cell" id="cell-53">53</div>
        <div class="bingo-cell" id="cell-68">68</div>

        <!-- Row 3 -->
        <div class="bingo-cell" id="cell-10">10</div>
        <div class="bingo-cell" id="cell-25">25</div>
        <div class="bingo-cell free-space" id="cell-free">FREE</div>
        <div class="bingo-cell" id="cell-55">55</div>
        <div class="bingo-cell" id="cell-70">70</div>

        <!-- Row 4 -->
        <div class="bingo-cell" id="cell-11">11</div>
        <div class="bingo-cell" id="cell-26">26</div>
        <div class="bingo-cell" id="cell-41">41</div>
        <div class="bingo-cell" id="cell-56">56</div>
        <div class="bingo-cell" id="cell-71">71</div>

        <!-- Row 5 (Corners) -->
        <div class="bingo-cell" id="cell-13">13</div>
        <div class="bingo-cell" id="cell-28">28</div>
        <div class="bingo-cell" id="cell-43">43</div>
        <div class="bingo-cell" id="cell-58">58</div>
        <div class="bingo-cell" id="cell-73">73</div>
    </div>

    <div class="board-number">Board 67</div>
    
    <div class="status-message" id="statusText">የBingo ማረጋገጫ በመካሄድ ላይ...</div>
    <div class="countdown" id="countdown">4</div>
</div>

<script>
    // =========================================================
    // እዚህ ጋር ነው የአሸናፊውን ስም የምትቀይረው
    // =========================================================
    const winnerName = "አበበ ከበደ"; // <--- ትክክለኛውን የተጫዋች ስም እዚህ አስገባ
    
    // በምስሉ ላይ የሚታዩት የተመረጡ ቁጥሮች (ከጀርባ ዳታቤዝህ መምጣት አለባቸው)
    const markedNumbers = [1, 16, 10, 25, 11, 26, 41, 56, 13, 28, 43, 58, 8, 23];
    
    // 2ኛ ማሻሻያ: የ4 ኮርነሮች (4 Corners) ማረጋገጫ
    function checkBingoWin() {
        // 4ቱ የማዕዘን ሴሎች (1, 61, 13, 73)
        const corners = [
            document.getElementById('cell-1'),   // ላይኛው ግራ
            document.getElementById('cell-61'),  // ላይኛው ቀኝ (O አምድ የመጀመሪያ ረድፍ)
            document.getElementById('cell-13'),  // ታችኛው ግራ
            document.getElementById('cell-73')   // ታችኛው ቀኝ
        ];

        // ሁሉም 4 ማዕዘኖች መመረጣቸውን ማረጋገጥ
        const isWin = corners.every(cell => {
            return cell && (cell.classList.contains('marked') || cell.classList.contains('winning-cell'));
        });

        return isWin;
    }

    function renderBingoStatus() {
        // 1. የአሸናፊውን ስም ማሳየት
        document.getElementById('winnerNameDisplay').innerText = "🎉 " + winnerName + " አሸንፏል! 🎉";

        // 2. የተመረጡትን ቁጥሮች ማሳየት
        markedNumbers.forEach(num => {
            const cell = document.getElementById(`cell-${num}`);
            if (cell) {
                cell.classList.add('marked');
            }
        });

        // 3. የBingo ማረጋገጫ
        const hasWon = checkBingoWin();

        const statusText = document.getElementById('statusText');
        const countdownEl = document.getElementById('countdown');

        if (hasWon) {
            statusText.innerText = "የBingo ማረጋገጫ: ትክክል! (4 Corners)";
            statusText.style.color = "#00f5d4";
            
            // 4ቱን ማዕዘኖች በወርቃማ ቀለም ማጉላት (Winning Highlight)
            document.getElementById('cell-1').classList.add('winning-cell');
            document.getElementById('cell-61').classList.add('winning-cell');
            document.getElementById('cell-13').classList.add('winning-cell');
            document.getElementById('cell-73').classList.add('winning-cell');

            // Countdown ማሳያ
            let count = 4;
            countdownEl.innerText = count;
            const timer = setInterval(() => {
                count--;
                countdownEl.innerText = count;
                if (count <= 0) {
                    clearInterval(timer);
                    countdownEl.innerText = "0";
                    // እዚህ ጋር ወደ ቀጣዩ ጨዋታ መሄድ ይቻላል
                }
            }, 1000);

        } else {
            statusText.innerText = "የBingo ማረጋገጫ: ስህተት! እባክህ በድጋሚ ሞክር።";
            statusText.style.color = "#e63946";
            countdownEl.innerText = "X";
        }
    }

    // ገጹ ሲጫን ማስኬድ
    window.onload = renderBingoStatus;

</script>

</body>
</html>
