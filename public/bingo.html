<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0616" />
<title>Abyssinia Bingo</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root{
    --bg-0:#0b0616; --bg-1:#130c26; --bg-2:#1a1035; --bg-3:#241649;
    --ink:#f5f3ff; --muted:#a78bfa; --accent:#8b5cf6; --accent-2:#a855f7;
    --neon-pink:#ec4899; --neon-cyan:#22d3ee; --neon-green:#22c55e;
    --neon-orange:#fb923c; --neon-gold:#facc15; --border:rgba(167,139,250,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:'Inter','Segoe UI',sans-serif;
    background:linear-gradient(160deg,var(--bg-0) 0%,var(--bg-1) 40%,var(--bg-2) 100%);
    background-attachment:fixed;color:var(--ink);height:100vh;height:100dvh;
    padding:5px;padding-top:calc(env(safe-area-inset-top) + 5px);padding-bottom:calc(env(safe-area-inset-bottom) + 5px);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  }

  /* SPLASH */
  #splash{
    position:fixed;inset:0;z-index:500;background:linear-gradient(160deg,var(--bg-0) 0%,var(--bg-1) 40%,var(--bg-2) 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:30px;
  }
  #splash.hide{animation:fade-out .5s forwards}
  @keyframes fade-out{to{opacity:0;visibility:hidden}}
  .splash-logo{width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #fff2b0, var(--neon-gold) 45%, #b45309 100%);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 0 40px rgba(250,204,21,.6);animation:spin-pulse 2s infinite;}
  @keyframes spin-pulse{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.1) rotate(10deg)}}
  .splash-title{font-size:24px;font-weight:900;background:linear-gradient(135deg,var(--neon-gold),var(--neon-pink),var(--neon-cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.25;}

  .container{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;height:100%;overflow:hidden;gap:4px;}

  /* TOPBAR */
  .topbar{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;flex-shrink:0}
  .stat{background:linear-gradient(180deg,rgba(139,92,246,.14),rgba(139,92,246,.05));border:1px solid var(--border);border-radius:7px;padding:4px 2px;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:38px;}
  .stat small{font-size:7px;color:var(--muted);font-weight:800;text-transform:uppercase}
  .stat b{font-size:11px;color:var(--ink);font-weight:900;margin-top:2px}
  .stat.purple b{color:var(--neon-pink)}
  .jackpot-bar{background:linear-gradient(90deg,#f59e0b,#facc15,#f59e0b);background-size:200% 100%;border-radius:8px;padding:5px 10px;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:11px;color:#1a0a2e;flex-shrink:0;animation:jackpot-shine 3s linear infinite;}
  @keyframes jackpot-shine{0%{background-position:0% 50%}100%{background-position:200% 50%}}

  /* MAIN SPLIT */
  .main-split{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:45% 1fr;gap:5px;overflow:hidden;}

  /* LEFT: NUMBERS */
  .board-column{display:flex;flex-direction:column;gap:3px;min-height:0;overflow:hidden;}
  .bh-row{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;flex-shrink:0}
  .bh{padding:4px 0;text-align:center;font-weight:900;font-size:13px;color:#fff;border-radius:5px;}
  .bh.b{background:linear-gradient(135deg,#f97316,#ea580c)} .bh.i{background:linear-gradient(135deg,#10b981,#047857)}
  .bh.n{background:linear-gradient(135deg,#3b82f6,#1d4ed8)} .bh.g{background:linear-gradient(135deg,#ef4444,#b91c1c)}
  .bh.o{background:linear-gradient(135deg,#a855f7,#7e22ce)}
  .num-grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(15,1fr);gap:2px;}
  .num-cell{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;border-radius:4px;background:rgba(139,92,246,.06);color:rgba(245,243,255,.45);transition:all .3s;}
  .num-cell.called{background:linear-gradient(135deg,var(--neon-orange),#ea580c);color:#fff;box-shadow:0 0 6px rgba(251,146,60,.5);}
  .num-cell.latest{background:linear-gradient(135deg,var(--neon-gold),#eab308);color:#1a0a2e;border:1.5px solid #fff;box-shadow:0 0 12px rgba(250,204,21,.9);}

  /* RIGHT: CONTROLS */
  .control-column{display:flex;flex-direction:column;gap:5px;min-height:0;overflow:hidden;}
  .mode-row{display:grid;grid-template-columns:1fr 1fr;gap:4px;flex-shrink:0}
  .mode-btn{display:flex;align-items:center;justify-content:center;padding:5px;border-radius:8px;font-size:10px;font-weight:900;background:rgba(139,92,246,.12);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .2s;}
  .mode-btn.on{background:linear-gradient(135deg,var(--neon-green),#10b981);color:#0b0616;border-color:transparent;}

  .status-box{background:linear-gradient(180deg,rgba(139,92,246,.16),rgba(139,92,246,.05));border:1px solid rgba(167,139,250,.3);border-radius:8px;padding:5px;text-align:center;flex-shrink:0;}
  .status-box .txt{font-size:11px;font-weight:900;color:var(--neon-green);text-transform:uppercase;}

  .call-pill{background:linear-gradient(135deg,#6b2fb5,#8e44d0);border-radius:8px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;position:relative;box-shadow:0 3px 12px rgba(107,47,181,.4);}
  .call-pill .lbl{font-size:9px;font-weight:900;color:#fff;}
  .call-badge{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 28% 28%,#fff2b0,var(--neon-gold) 45%,#b45309 100%);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#1a0a2e;margin-top:4px;box-shadow:0 0 12px rgba(250,204,21,.65);}
  .last-calls{display:flex;gap:4px;justify-content:center;margin-top:6px;}
  .lc-chip{padding:2px 6px;border-radius:10px;font-size:9px;font-weight:800;background:rgba(0,0,0,.3);}

  /* CARDS AREA */
  .msg-area{flex:1 1 auto;min-height:0;background:linear-gradient(180deg,rgba(30,20,60,.55),rgba(20,12,40,.55));border:1px solid var(--border);border-radius:10px;padding:5px;display:flex;flex-direction:column;overflow-y:auto;}
  .msg-default{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:13px;font-weight:700;color:var(--neon-gold);line-height:1.6;}
  .msg-default .icon{font-size:40px;margin-bottom:10px;}

  /* CARTELAS DYNAMIC SIZING */
  .cartelas-list{display:flex;flex-direction:column;gap:6px;width:100%;}
  .cartela-card{background:var(--bg-1);border:1px solid var(--border);border-radius:8px;padding:6px;display:flex;flex-direction:column;}
  .cartela-head{display:flex;justify-content:space-between;font-size:10px;font-weight:800;color:var(--neon-orange);margin-bottom:4px;}
  .cartela-grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:3px;}
  .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:800;border-radius:5px;background:rgba(139,92,246,.10);border:1px solid rgba(167,139,250,.12);font-size:14px;cursor:pointer;}
  .cell.marked{background:linear-gradient(135deg,var(--neon-orange),#ea580c);color:#fff;border-color:transparent;}
  .cell.tappable{animation:tappable-pulse 1.4s infinite;border-color:rgba(34,211,238,.6);}
  @keyframes tappable-pulse{0%,100%{box-shadow:inset 0 0 0px rgba(34,211,238,0)}50%{box-shadow:inset 0 0 10px rgba(34,211,238,.5)}}

  /* BINGO BUTTON IN CARD */
  .card-bingo-btn{width:100%;margin-top:6px;padding:8px;border-radius:6px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-weight:900;font-size:13px;border:none;cursor:pointer;box-shadow:0 3px 8px rgba(16,185,129,.4);}
  .card-bingo-btn:disabled{background:#3a2545;color:#7a6b99;box-shadow:none;}

  /* PICKER */
  .picker-wrap{flex:1;display:flex;flex-direction:column;gap:5px;overflow:hidden}
  .picker{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;overflow-y:auto;padding:8px;background:rgba(30,20,60,.55);border-radius:10px;}
  .pick{padding:8px 0;background:rgba(139,92,246,.10);border-radius:6px;text-align:center;font-weight:800;font-size:11px;cursor:pointer;}
  .pick.sel{background:linear-gradient(135deg,var(--neon-pink),var(--accent-2));color:#fff;}
  .pick.taken{background:rgba(34,197,94,.15);color:rgba(34,197,94,.65);text-decoration:line-through;cursor:not-allowed;}
  .pick.mine{background:linear-gradient(135deg,var(--neon-cyan),var(--accent));color:#0b0616;}

  /* BOTTOM */
  .bottom-bar{display:flex;gap:4px;flex-shrink:0}
  .btn-bingo{flex:1;padding:12px;border-radius:9px;background:linear-gradient(135deg,#ec4899,#be185d);color:#fff;font-weight:900;font-size:14px;border:none;box-shadow:0 3px 12px rgba(236,72,153,.5);cursor:pointer;}
  .btn-bingo:disabled{background:#3a2545;color:#7a6b99;box-shadow:none;}
  .icon-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;flex-shrink:0}
  .icon-bar button{padding:6px 2px;border-radius:7px;background:rgba(139,92,246,.10);border:1px solid var(--border);color:var(--ink);font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;}
  .icon-bar button small{font-size:8px;color:var(--muted);margin-top:2px;font-weight:700}

  .toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(20,10,40,.95);border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:12px;font-weight:700;z-index:99;animation:toast-in .25s;}
  @keyframes toast-in{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .hidden{display:none !important}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-logo">🎯</div>
  <div class="splash-title">Welcome to<br>Abyssinia Bingo</div>
  <div class="splash-status" id="splashStatus">Connecting…</div>
</div>

<div class="container">
  <div class="topbar">
    <div class="stat purple"><small>DERASH</small><b id="derashLbl">0</b></div>
    <div class="stat"><small>PLAYERS</small><b id="playersLbl">0</b></div>
    <div class="stat"><small>BET</small><b id="betLbl">10</b></div>
    <div class="stat"><small>CALL</small><b id="callLbl">--</b></div>
    <div class="stat"><small>GAME №</small><b id="gameNoLbl">1</b></div>
  </div>

  <div class="jackpot-bar">
    <span>💰 JACKPOT</span><span><span id="jackpotAmt">0</span> ETB</span>
  </div>

  <div id="selectScreen" class="picker-wrap hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:4px;">
      <div><span id="selCount">0</span>/4 Selected</div>
      <div style="font-weight:900;color:var(--neon-cyan);font-size:18px;" id="countdownBtn">30</div>
    </div>
    <div class="picker" id="picker"></div>
    <button class="btn-bingo" id="joinBtn" disabled>🎯 JOIN GAME</button>
    <div class="msg" id="selMsg" style="text-align:center;font-size:11px;margin-top:5px;color:var(--muted);">Pick 1–4 cartelas</div>
  </div>

  <div id="gameScreen" class="hidden" style="flex:1;display:flex;flex-direction:column;gap:4px;min-height:0">
    <div class="main-split">
      <!-- LEFT: Board -->
      <div class="board-column">
        <div class="bh-row">
          <div class="bh b">B</div><div class="bh i">I</div><div class="bh n">N</div><div class="bh g">G</div><div class="bh o">O</div>
        </div>
        <div class="num-grid" id="numberGrid"></div>
      </div>

      <!-- RIGHT: Controls & Cards -->
      <div class="control-column">
        <div class="mode-row">
          <div class="mode-btn manual on" id="modeManualBtn">MANUAL</div>
          <div class="mode-btn" id="modeAutoBtn">AUTO</div>
        </div>
        
        <div class="status-box" id="statusBox"><div class="txt" id="statusTxt">WAITING</div></div>

        <div class="call-pill">
          <div class="lbl">CURRENT CALL</div>
          <div class="call-badge" id="liveBall">--</div>
          <div class="last-calls" id="lastCalls"></div>
        </div>

        <!-- Area where cartelas or wait message goes -->
        <div class="msg-area" id="msgArea">
          <div class="msg-default" id="msgDefault" style="display:none;">
            <div class="icon">⏳</div>
            <div>እባክዎ ይጠብቁ<br>የሚቀጥለው ጨዋታ እስኪጀመር ድረስ</div>
          </div>
          <div class="cartelas-list hidden" id="cartelasList"></div>
        </div>
      </div>
    </div>

    <div class="progress" style="height:3px;background:rgba(255,255,255,.1);border-radius:3px;"><div class="progress-fill" id="progressFill" style="height:100%;width:0%;background:var(--neon-gold);"></div></div>

    <div class="icon-bar">
      <button onclick="location.href='/profile.html?uid='+userId"><span>💼</span><small>Wallet</small></button>
      <button onclick="showToast('Balance checked')"><span>💵</span><small>Balance</small></button>
      <button onclick="location.href='/profile.html?uid='+userId+'&tab=history'"><span>📜</span><small>History</small></button>
      <button onclick="showToast('Link copied')"><span>🎁</span><small>Invite</small></button>
      <button onclick="showToast('Language toggled')"><span>🌐</span><small>Lang</small></button>
      <button onclick="showToast('Help opened')"><span>❓</span><small>Help</small></button>
    </div>
  </div>
</div>

<!-- Voice Toggle -->
<button id="voiceToggleBtn" style="position:fixed;top:6px;right:6px;z-index:200;background:rgba(139,92,246,.85);color:#fff;border:1px solid #a78bfa;padding:6px 10px;border-radius:8px;font-weight:900;font-size:11px;cursor:pointer;">
  <span id="voiceIcon">🔇</span> OFF
</button>

<script>
const p = new URLSearchParams(location.search);
const userId = Number(p.get('uid')) || 0;
const firstName = p.get('name') || 'Player';
const socket = io();

let phase = 'selection', selected = [], myCartelas = [], calledNumbers = [];
let takenSet = new Set(), availableCartelas = 600, fee = 10, cdTimer = null;
let userProfile = null, playMode = 'manual', manMarks = new Set(), voiceEnabled = false;

// VOICE
document.getElementById('voiceToggleBtn').onclick = () => {
  voiceEnabled = !voiceEnabled;
  document.getElementById('voiceIcon').innerText = voiceEnabled ? '🔊' : '🔇';
  document.getElementById('voiceToggleBtn').style.background = voiceEnabled ? 'var(--neon-green)' : 'rgba(139,92,246,.85)';
  document.getElementById('voiceToggleBtn').style.color = voiceEnabled ? '#0b0616' : '#fff';
};

// INIT
async function loadState() {
  try {
    const r = await fetch('/api/game').then(x=>x.json());
    applyState(r);
  } catch(e){}
}
async function loadProfile() {
  try {
    const r = await fetch('/api/profile/' + userId).then(x=>x.json());
    if (r.success) {
      userProfile = r.user;
      document.getElementById('betLbl').innerText = r.user ? fee : 10;
    }
  } catch(e){}
}
async function loadMyCartelas() {
  try {
    const r = await fetch('/api/my-cartelas/' + userId).then(x=>x.json());
    if (r.success && r.cartelas && r.cartelas.length) {
      myCartelas = r.cartelas;
      showGameScreen();
      renderCartelas();
    }
  } catch(e){}
}

function applyState(s) {
  phase = s.phase;
  takenSet = new Set(s.takenCartelas || []);
  calledNumbers = s.calledNumbers || [];
  document.getElementById('playersLbl').innerText = s.playerCount || 0;
  document.getElementById('derashLbl').innerText = (s.prizePool||0);
  document.getElementById('jackpotAmt').innerText = s.jackpot || 0;
  document.getElementById('callLbl').innerText = s.currentCall ? "B-"+s.currentCall : '--';
  
  if (s.currentCall) document.getElementById('liveBall').innerText = s.currentCall;
  
  const txt = document.getElementById('statusTxt');
  if (phase === 'running') { txt.innerText = 'STARTED'; txt.style.color = 'var(--neon-green)'; }
  else if (phase === 'selection') { txt.innerText = 'WAITING'; txt.style.color = 'var(--neon-orange)'; }
  else { txt.innerText = 'FINISHED'; txt.style.color = 'var(--neon-pink)'; }

  if (phase === 'selection' && myCartelas.length === 0) {
    showSelectionScreen();
    startCountdownUI(s.selectionEndsAt);
  } else {
    showGameScreen();
  }

  renderLastCalls();
  renderPicker();
  renderCartelas();
  renderNumberGrid();
  updateMessageArea();
}

function updateMessageArea() {
  const m = document.getElementById('msgDefault');
  const c = document.getElementById('cartelasList');
  if (myCartelas.length > 0) {
    m.style.display = 'none'; c.classList.remove('hidden');
  } else {
    m.style.display = 'flex'; c.classList.add('hidden');
  }
}

// RENDER CARTELAS
function renderCartelas() {
  const wrap = document.getElementById('cartelasList');
  wrap.innerHTML = '';
  myCartelas.forEach(c => {
    const card = document.createElement('div');
    card.className = 'cartela-card';
    card.innerHTML = `<div class="cartela-head"><span>BOARD ${c.id}</span></div>`;
    
    const grid = document.createElement('div');
    grid.className = 'cartela-grid';
    for (let r = 0; r < 5; r++) {
      for (let col = 0; col < 5; col++) {
        const n = c.grid[r][col];
        const d = document.createElement('div');
        d.className = 'cell';
        d.dataset.n = n;
        d.innerText = n === 0 ? 'FREE' : n;
        if (n === 0) d.style.background = '#2563eb';
        if (n !== 0) d.onclick = () => onCellClick(n, d);
        grid.appendChild(d);
      }
    }
    card.appendChild(grid);

    // BINGO Button inside each card
    const btn = document.createElement('button');
    btn.className = 'card-bingo-btn';
    btn.innerText = 'BINGO!';
    btn.disabled = true;
    btn.onclick = () => tryClaimBingo(c.id);
    card.appendChild(btn);

    wrap.appendChild(card);
    updateCardCells(c.id, card, btn);
  });
}

function updateCardCells(cid, card, btn) {
  const cartela = myCartelas.find(c => c.id === cid);
  if (!cartela) return;
  const called = new Set(calledNumbers); called.add(0);
  
  card.querySelectorAll('.cell').forEach(el => {
    const n = Number(el.dataset.n);
    if (n === 0) return;
    const isCalled = called.has(n);
    const isManMark = manMarks.has(n);
    const marked = (playMode === 'auto' && isCalled) || (playMode === 'manual' && isManMark);
    
    el.classList.remove('marked', 'tappable');
    if (marked) el.classList.add('marked');
    else if (playMode === 'manual' && isCalled) el.classList.add('tappable');
  });

  const marks = getMarkSet();
  if (phase === 'running' && evaluateWinClient(cartela, marks) && !btn.classList.contains('win')) {
    btn.disabled = false;
  } else if (playMode === 'auto') {
    btn.disabled = true; // auto mode claims automatically
  } else {
    btn.disabled = true;
  }
}

function onCellClick(n, el) {
  if (playMode !== 'manual' || phase !== 'running') return;
  if (manMarks.has(n)) manMarks.delete(n);
  else manMarks.add(n);
  myCartelas.forEach(c => {
    const card = el.closest('.cartela-card');
    const btn = card.querySelector('.card-bingo-btn');
    updateCardCells(c.id, card, btn);
  });
}

function getMarkSet() {
  const s = new Set(); s.add(0);
  if (playMode === 'auto') calledNumbers.forEach(n => s.add(n));
  else manMarks.forEach(n => { if(calledNumbers.includes(n)) s.add(n); });
  return s;
}

// BINGO LOGIC
function evaluateWinClient(cartela, marks) {
  const g = cartela.grid;
  for (let r=0;r<5;r++){ if(g[r].every(n=>marks.has(n))) return true; }
  for (let c=0;c<5;c++){ if([0,1,2,3,4].every(r=>marks.has(g[r][c]))) return true; }
  if([0,1,2,3,4].every(i=>marks.has(g[i][i]))) return true;
  if([0,1,2,3,4].every(i=>marks.has(g[i][4-i]))) return true;
  return false;
}

async function tryClaimBingo(cid) {
  try {
    const r = await fetch('/api/player/bingo', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({userId, cartelaId: cid})
    }).then(x=>x.json());
    if (!r.success) showToast(r.error);
  } catch(e){}
}

// OTHER RENDERS
function renderNumberGrid() {
  const grid = document.getElementById('numberGrid');
  if (grid.children.length === 0) {
    for (let r = 0; r < 15; r++) {
      for (let c = 0; c < 5; c++) {
        const n = c*15 + r + 1;
        const d = document.createElement('div');
        d.className = 'num-cell'; d.id = 'nc-'+n; d.innerText = n;
        grid.appendChild(d);
      }
    }
  }
  document.querySelectorAll('.num-cell').forEach(el => el.classList.remove('called', 'latest'));
  calledNumbers.forEach(n => {
    const el = document.getElementById('nc-'+n);
    if(el) el.classList.add('called');
  });
  if (calledNumbers.length > 0) {
    const last = document.getElementById('nc-'+calledNumbers[calledNumbers.length-1]);
    if(last) last.classList.add('latest');
  }
}

function renderLastCalls() {
  const el = document.getElementById('lastCalls');
  el.innerHTML = calledNumbers.slice(-3).reverse().map(n => `<div class="lc-chip">${n}</div>`).join('');
}

function startCountdownUI(endsAt) {
  clearInterval(cdTimer);
  const btn = document.getElementById('countdownBtn');
  cdTimer = setInterval(() => {
    const left = Math.max(0, Math.ceil((endsAt - Date.now())/1000));
    btn.innerText = left;
    if (left <= 0) clearInterval(cdTimer);
  }, 500);
}

function renderPicker() {
  const el = document.getElementById('picker');
  if (el.children.length !== availableCartelas) {
    el.innerHTML = '';
    for (let i = 1; i <= availableCartelas; i++) {
      const d = document.createElement('div');
      d.className = 'pick'; d.innerText = i;
      d.onclick = () => {
        if (takenSet.has(i)) return showToast('Taken');
        if (selected.includes(i)) selected = selected.filter(x=>x!==i);
        else if (selected.length >= 4) return showToast('Max 4');
        else selected.push(i);
        document.getElementById('selCount').innerText = selected.length;
        document.getElementById('joinBtn').disabled = selected.length === 0;
        renderPicker();
      };
      el.appendChild(d);
    }
  }
  for (let i = 1; i <= availableCartelas; i++) {
    const d = el.children[i-1];
    d.className = 'pick';
    if (takenSet.has(i)) d.classList.add('taken');
    else if (selected.includes(i)) d.classList.add('sel');
  }
}

// SCREEN SWITCHER
function showSelectionScreen() {
  document.getElementById('selectScreen').classList.remove('hidden');
  document.getElementById('gameScreen').classList.add('hidden');
}
function showGameScreen() {
  document.getElementById('selectScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
}

// JOIN
document.getElementById('joinBtn').onclick = async () => {
  document.getElementById('selMsg').innerText = 'Joining…';
  const r = await fetch('/api/player/join', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({userId, firstName, cartelaIds: selected})
  }).then(x=>x.json());
  if (!r.success) {
    document.getElementById('selMsg').innerText = '❌ ' + r.error;
    return;
  }
  myCartelas = r.cartelas;
  showGameScreen();
  renderCartelas();
};

// MODE TOGGLE
document.getElementById('modeManualBtn').onclick = () => {
  playMode = 'manual';
  document.getElementById('modeManualBtn').classList.add('on');
  document.getElementById('modeAutoBtn').classList.remove('on');
  renderCartelas();
};
document.getElementById('modeAutoBtn').onclick = () => {
  playMode = 'auto';
  document.getElementById('modeAutoBtn').classList.add('on');
  document.getElementById('modeManualBtn').classList.remove('on');
  renderCartelas();
  if (phase === 'running') myCartelas.forEach(c => tryClaimBingo(c.id));
};

// SOCKET EVENTS
socket.on('connect', () => { loadState(); loadProfile(); loadMyCartelas(); });
socket.on('game-state', s => applyState(s));
socket.on('number-called', ({number, all}) => {
  calledNumbers = all;
  renderNumberGrid();
  renderLastCalls();
  if (myCartelas.length > 0) {
    myCartelas.forEach(c => {
      const card = document.getElementById('cartela-'+c.id);
      if (card) updateCardCells(c.id, card, card.querySelector('.card-bingo-btn'));
    });
  }
});
socket.on('round-finished', w => {
  if (w) {
    const isMe = w.userId === userId;
    const div = document.createElement('div');
    div.className = 'modal-bg';
    div.innerHTML = `<div class="modal" style="text-align:center;">
      <h1 style="color:var(--neon-gold);font-size:24px;margin-bottom:10px;">WINNER</h1>
      <div style="font-size:20px;font-weight:900;margin-bottom:10px;">🏆 ${w.firstName}${isMe?' (YOU)':''}</div>
      <div style="font-size:32px;color:var(--neon-green);font-weight:900;">${w.prize} ETB</div>
    </div>`;
    document.body.appendChild(div);
    setTimeout(()=>div.remove(), 5000);
  }
  myCartelas = []; manMarks.clear(); selected = [];
  document.getElementById('cartelasList').innerHTML = '';
  document.getElementById('cartelasList').classList.add('hidden');
  document.getElementById('msgDefault').style.display = 'flex';
});

function showToast(m) {
  const t = document.createElement('div'); t.className = 'toast'; t.innerText = m;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 3000);
}

setTimeout(() => document.getElementById('splash').classList.add('hide'), 1500);
</script>
</body>
</html>
