<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>My Profile — Abisinya Bingo</title>
<style>
  :root{
    --bg-0:#0b0616; --bg-1:#130c26; --bg-2:#1a1035; --bg-3:#241649;
    --ink:#f5f3ff; --muted:#a78bfa; --accent:#8b5cf6;
    --neon-pink:#ec4899; --neon-cyan:#22d3ee; --neon-green:#22c55e; --neon-gold:#facc15;
    --border:rgba(167,139,250,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{
    font-family:'Inter','Segoe UI',sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -100px, rgba(168,85,247,.18), transparent 60%),
      linear-gradient(160deg,var(--bg-0) 0%,var(--bg-1) 40%,var(--bg-2) 100%);
    background-attachment:fixed; color:var(--ink); min-height:100vh;
    padding:12px; padding-top:calc(env(safe-area-inset-top) + 12px);
    padding-bottom:calc(env(safe-area-inset-bottom) + 20px);
  }
  .container{max-width:640px;margin:0 auto}
  .card{
    background:linear-gradient(180deg,rgba(139,92,246,.12),rgba(139,92,246,.04));
    border:1px solid var(--border); border-radius:14px;
    backdrop-filter:blur(10px); padding:14px; margin-bottom:10px;
  }
  .label{font-size:10px;font-weight:800;text-transform:uppercase;
         letter-spacing:.6px;color:var(--muted);margin-bottom:6px;display:block}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tab-btn{
    padding:9px 12px;border-radius:9px;font-weight:700;font-size:12px;
    background:rgba(139,92,246,.10);border:1px solid var(--border);
    color:var(--muted);cursor:pointer;flex:1;transition:all .2s;
  }
  .tab-btn.active{
    background:linear-gradient(135deg,var(--accent),var(--neon-pink));
    color:#fff;border-color:transparent;
    box-shadow:0 4px 14px rgba(168,85,247,.4);
  }
  .tx-row{
    display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;
    padding:8px 4px;border-bottom:1px solid rgba(167,139,250,.10);
    font-size:12px;
  }
  .tx-row:last-child{border-bottom:none}
  .badge{
    display:inline-block;padding:2px 7px;border-radius:5px;
    font-size:9px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;
  }
  .badge.approved{background:rgba(34,197,94,.18);color:#22c55e}
  .badge.pending{background:rgba(251,146,60,.18);color:#fb923c}
  .badge.rejected{background:rgba(236,72,153,.18);color:#ec4899}
  .badge.win{background:rgba(250,204,21,.18);color:#facc15}
  .badge.deposit{background:rgba(34,211,238,.18);color:#22d3ee}
  .badge.withdraw{background:rgba(168,85,247,.20);color:#a855f7}
  .badge.bet{background:rgba(139,92,246,.18);color:#a78bfa}

  .lb-row{
    display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;
    padding:8px 6px;border-bottom:1px solid rgba(167,139,250,.10);
  }
  .lb-row:last-child{border-bottom:none}
  .rank{
    width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:12px;background:rgba(139,92,246,.18);color:var(--muted);
  }
  .rank.gold{background:linear-gradient(135deg,#facc15,#eab308);color:#1a0a2e}
  .rank.silver{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#1a0a2e}
  .rank.bronze{background:linear-gradient(135deg,#fb923c,#b45309);color:#fff}

  .btn{
    padding:10px 14px;border-radius:10px;font-weight:800;font-size:12px;
    border:none;cursor:pointer;transition:all .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn.dep{
    background:linear-gradient(135deg,#22d3ee,#0891b2);
    color:#0b0616;box-shadow:0 4px 14px rgba(34,211,238,.4);
    flex:1;
  }
  .btn.wd{
    background:linear-gradient(135deg,#a855f7,#7e22ce);
    color:#fff;box-shadow:0 4px 14px rgba(168,85,247,.4);
    flex:1;
  }
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--neon-pink));color:#fff}
  .btn.ghost{background:rgba(139,92,246,.12);color:var(--ink);border:1px solid var(--border)}
  .back-pill{
    display:inline-flex;align-items:center;gap:6px;padding:6px 12px;
    border-radius:20px;background:rgba(139,92,246,.12);border:1px solid var(--border);
    color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;
    text-decoration:none;margin-bottom:10px;
  }

  /* modal */
  .modal-bg{
    position:fixed;inset:0;background:rgba(10,5,25,.9);
    backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:16px;animation:fade-in .25s;
  }
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
  .modal{
    background:linear-gradient(160deg,var(--bg-3),var(--bg-2));
    border:1px solid rgba(168,85,247,.4);
    border-radius:16px; padding:20px; max-width:400px; width:100%;
    box-shadow:0 0 40px rgba(168,85,247,.35);
    animation:pop-modal .4s;
  }
  @keyframes pop-modal{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h2{font-size:18px;margin-bottom:8px;color:var(--neon-gold)}
  .modal p{font-size:12px;color:var(--muted);margin-bottom:10px}
  .input, .select{
    padding:11px 12px;border-radius:10px;width:100%;
    background:rgba(11,6,22,.7);border:1px solid var(--border);
    color:var(--ink);font-size:14px;margin-bottom:8px;
  }
  .input:focus, .select:focus{
    outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(139,92,246,.15);
  }
  .method-row{
    display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;
  }
  .method-btn{
    padding:11px;border-radius:10px;font-weight:800;font-size:13px;
    background:rgba(139,92,246,.10);border:1px solid var(--border);
    color:var(--ink);cursor:pointer;transition:all .15s;
  }
  .method-btn.sel{
    background:linear-gradient(135deg,var(--accent),var(--neon-pink));
    color:#fff;border-color:transparent;
    box-shadow:0 4px 14px rgba(168,85,247,.5);
  }
  .modal-actions{display:flex;gap:6px;margin-top:8px}
  .modal-actions .btn{flex:1}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:rgba(20,10,40,.95);border:1px solid rgba(168,85,247,.4);
    color:var(--ink);padding:12px 20px;border-radius:10px;
    font-size:13px;font-weight:700;z-index:200;
    animation:toast-in .25s;max-width:90%;
  }
  @keyframes toast-in{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

  .spinner{
    display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
    margin-right:6px;vertical-align:-2px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .hidden{display:none !important}
</style>
</head>
<body>
<div class="container">

  <a class="back-pill" id="backBtn">← Back to Game</a>

  <!-- WALLET -->
  <div class="card">
    <div class="label">💼 MY WALLET</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div>
        <div style="font-size:26px;font-weight:900" id="balanceLbl">--</div>
        <div style="font-size:10px;color:var(--muted)">Playable (ETB)</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:18px;font-weight:900;color:var(--neon-gold)" id="winLbl">--</div>
        <div style="font-size:10px;color:var(--muted)">Winnings</div>
      </div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn dep" onclick="openDeposit()">💰 DEPOSIT</button>
      <button class="btn wd" onclick="openWithdraw()">📤 WITHDRAW</button>
    </div>
  </div>

  <!-- STATS -->
  <div class="card">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center">
      <div>
        <div style="font-size:20px;font-weight:900" id="gamesLbl">0</div>
        <div style="font-size:10px;color:var(--muted)">Games</div>
      </div>
      <div>
        <div style="font-size:20px;font-weight:900;color:var(--neon-pink)" id="winsLbl">0</div>
        <div style="font-size:10px;color:var(--muted)">Wins</div>
      </div>
      <div>
        <div style="font-size:20px;font-weight:900;color:var(--neon-gold)" id="earnLbl">0</div>
        <div style="font-size:10px;color:var(--muted)">Earned</div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="history" onclick="switchTab('history')">📋 History</button>
    <button class="tab-btn" data-tab="leader" onclick="switchTab('leader')">🏆 Leaderboard</button>
  </div>

  <div class="card" id="historyPanel">
    <div id="txList"></div>
    <div style="display:flex;justify-content:space-between;margin-top:10px" id="pager"></div>
  </div>

  <div class="card hidden" id="leaderPanel">
    <div class="tabs" style="margin-bottom:8px">
      <button class="tab-btn active" data-range="day" onclick="switchRange('day')">Today</button>
      <button class="tab-btn" data-range="week" onclick="switchRange('week')">Week</button>
      <button class="tab-btn" data-range="all" onclick="switchRange('all')">All</button>
    </div>
    <div id="lbList"></div>
  </div>
</div>

<script>
if (window.Telegram && window.Telegram.WebApp){
  const tw = window.Telegram.WebApp;
  tw.expand();
  tw.setHeaderColor?.('#0b0616');
  tw.setBackgroundColor?.('#0b0616');
}
const p = new URLSearchParams(location.search);
const userId = Number(p.get('uid')) || 0;
const initialTab = p.get('tab') || 'history';
let page = 1;
let myProfile = null;

document.getElementById('backBtn').onclick = () => {
  location.href = '/game?uid=' + userId;
};

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.innerText = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}

// ============================================================
// PROFILE
// ============================================================
async function loadProfile(){
  try {
    const r = await fetch('/api/profile/' + userId).then(x=>x.json());
    if (!r.success) return;
    const u = r.user; myProfile = u;
    document.getElementById('balanceLbl').innerText = u.balance.toFixed(2) + ' ETB';
    document.getElementById('winLbl').innerText = u.winBalance.toFixed(2) + ' ETB';
    document.getElementById('gamesLbl').innerText = u.totalGames || 0;
    document.getElementById('winsLbl').innerText = u.totalWins || 0;
    document.getElementById('earnLbl').innerText = (u.totalEarnings || 0).toFixed(0);
  } catch(e){}
}

// ============================================================
// HISTORY
// ============================================================
async function loadHistory(pg=1){
  page = pg;
  try {
    const r = await fetch(`/api/history/${userId}?page=${pg}`).then(x=>x.json());
    if (!r.success) return;
    const el = document.getElementById('txList');
    if (!r.txs.length){
      el.innerHTML = '<div style="text-align:center;padding:16px;color:var(--muted);font-size:12px">No transactions yet</div>';
      document.getElementById('pager').innerHTML = '';
      return;
    }
    el.innerHTML = r.txs.map(tx => {
      const when = new Date(tx.createdAt).toLocaleString();
      const isIn = (tx.type === 'deposit' || tx.type === 'win');
      const sign = isIn ? '+' : '-';
      const color = isIn ? 'var(--neon-green)' : 'var(--neon-pink)';
      const gameTag = tx.gameId ? ` · Game #${tx.gameId}` : '';
      return `
        <div class="tx-row">
          <div><span class="badge ${tx.type}">${tx.type}</span></div>
          <div>
            <div style="font-weight:700;color:${color}">${sign}${tx.amount.toFixed(2)} ETB</div>
            <div style="color:var(--muted);font-size:10px">${when}${gameTag}</div>
          </div>
          <div style="text-align:right"><span class="badge ${tx.status}">${tx.status}</span></div>
        </div>`;
    }).join('');
    document.getElementById('pager').innerHTML = `
      <button ${page<=1?'disabled':''} onclick="loadHistory(${page-1})" class="tab-btn" style="max-width:100px;${page<=1?'opacity:.4':''}">← Prev</button>
      <span style="font-size:11px;color:var(--muted);align-self:center">Page ${page} / ${r.totalPages}</span>
      <button ${page>=r.totalPages?'disabled':''} onclick="loadHistory(${page+1})" class="tab-btn" style="max-width:100px;${page>=r.totalPages?'opacity:.4':''}">Next →</button>
    `;
  } catch(e){}
}

// ============================================================
// LEADERBOARD
// ============================================================
async function loadLeaderboard(range='all'){
  try {
    const r = await fetch('/api/leaderboard?range=' + range).then(x=>x.json());
    if (!r.success) return;
    const el = document.getElementById('lbList');
    if (!r.list.length){
      el.innerHTML = '<div style="text-align:center;padding:16px;color:var(--muted);font-size:12px">No winners yet</div>';
      return;
    }
    el.innerHTML = r.list.map((u,i) => {
      const rankCls = i===0?'gold':i===1?'silver':i===2?'bronze':'';
      const name = u.firstName || u.username || ('User ' + u.telegramId);
      const isMe = u.telegramId === userId;
      return `
        <div class="lb-row" style="${isMe?'background:rgba(236,72,153,.08);border-radius:8px':''}">
          <div class="rank ${rankCls}">${i+1}</div>
          <div>
            <div style="font-weight:800;font-size:12px">${name}${isMe?' · <span style="color:var(--neon-pink);font-size:10px">YOU</span>':''}</div>
            <div style="color:var(--muted);font-size:10px">${u.totalWins} wins</div>
          </div>
          <div style="text-align:right;font-weight:900;color:var(--neon-gold);font-size:12px">
            ${(u.totalEarnings||0).toFixed(0)} ETB
          </div>
        </div>`;
    }).join('');
  } catch(e){}
}

function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b => {
    if (b.dataset.tab) b.classList.toggle('active', b.dataset.tab === name);
  });
  document.getElementById('historyPanel').classList.toggle('hidden', name !== 'history');
  document.getElementById('leaderPanel').classList.toggle('hidden', name !== 'leader');
  if (name === 'leader') loadLeaderboard('all');
}
function switchRange(range){
  document.querySelectorAll('#leaderPanel .tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.range === range);
  });
  loadLeaderboard(range);
}

// ============================================================
// DEPOSIT MODAL
// ============================================================
function openDeposit(){
  const ov = document.createElement('div');
  ov.className = 'modal-bg';
  ov.id = 'depositModal';
  ov.innerHTML = `
    <div class="modal">
      <h2>💰 Deposit</h2>
      <p>Choose payment method and amount.</p>

      <label class="label">Payment Method</label>
      <div class="method-row">
        <button class="method-btn sel" data-method="telebirr">📲 Telebirr</button>
        <button class="method-btn" data-method="cbe">🏦 CBE</button>
      </div>

      <label class="label">Amount (ETB)</label>
      <input class="input" id="depAmount" type="number" min="10" placeholder="e.g. 100" />

      <label class="label">Your Phone / Account</label>
      <input class="input" id="depPhone" type="tel" placeholder="09xxxxxxxx" />

      <label class="label">Bank SMS (paste)</label>
      <input class="input" id="depSms" type="text" placeholder="Paste the confirmation SMS" />

      <div id="depErr" style="color:var(--neon-pink);font-size:11px;margin-bottom:6px"></div>

      <div class="modal-actions">
        <button class="btn ghost" onclick="closeModal('depositModal')">Cancel</button>
        <button class="btn primary" id="depSubmit">Send Request</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  ov.querySelectorAll('.method-btn').forEach(b => {
    b.onclick = () => {
      ov.querySelectorAll('.method-btn').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
    };
  });

  ov.addEventListener('click', e => { if (e.target === ov) closeModal('depositModal'); });
  document.getElementById('depSubmit').onclick = submitDeposit;
}

async function submitDeposit(){
  const err = document.getElementById('depErr');
  const method = document.querySelector('#depositModal .method-btn.sel')?.dataset.method || 'telebirr';
  const amount = Number(document.getElementById('depAmount').value);
  const phone = document.getElementById('depPhone').value.trim();
  const sms = document.getElementById('depSms').value.trim();

  if (!amount || amount < 10){ err.innerText = '⚠️ Minimum 10 ETB'; return; }
  if (!phone || phone.length < 9){ err.innerText = '⚠️ Enter valid phone'; return; }
  if (!sms){ err.innerText = '⚠️ Paste the SMS confirmation'; return; }

  const btn = document.getElementById('depSubmit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Sending…';

  try {
    const r = await fetch('/api/deposit/request', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ userId, amount, method, phone, sms })
    }).then(x=>x.json());
    if (r.success){
      closeModal('depositModal');
      toast('✅ Deposit sent to admin');
      loadHistory(1);
    } else {
      err.innerText = '❌ ' + (r.error || 'failed');
      btn.disabled = false;
      btn.innerText = 'Send Request';
    }
  } catch(e){
    err.innerText = '❌ Network error';
    btn.disabled = false;
    btn.innerText = 'Send Request';
  }
}

// ============================================================
// WITHDRAW MODAL
// ============================================================
function openWithdraw(){
  if (!myProfile) return toast('⚠️ Profile not loaded');
  const available = myProfile.balance + myProfile.winBalance;
  const ov = document.createElement('div');
  ov.className = 'modal-bg';
  ov.id = 'withdrawModal';
  ov.innerHTML = `
    <div class="modal">
      <h2>📤 Withdraw</h2>
      <p>Available: <b style="color:var(--neon-gold)">${available.toFixed(2)} ETB</b> · Min 100 ETB</p>

      <label class="label">Payment Method</label>
      <div class="method-row">
        <button class="method-btn sel" data-method="telebirr">📲 Telebirr</button>
        <button class="method-btn" data-method="cbe">🏦 CBE</button>
      </div>

      <label class="label">Amount (ETB)</label>
      <input class="input" id="wdAmount" type="number" min="100" placeholder="e.g. 100" />

      <label class="label">Your Phone / Account</label>
      <input class="input" id="wdPhone" type="tel" placeholder="09xxxxxxxx" />

      <div id="wdErr" style="color:var(--neon-pink);font-size:11px;margin-bottom:6px"></div>

      <div class="modal-actions">
        <button class="btn ghost" onclick="closeModal('withdrawModal')">Cancel</button>
        <button class="btn primary" id="wdSubmit">Request Withdraw</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  ov.querySelectorAll('.method-btn').forEach(b => {
    b.onclick = () => {
      ov.querySelectorAll('.method-btn').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
    };
  });
  ov.addEventListener('click', e => { if (e.target === ov) closeModal('withdrawModal'); });
  document.getElementById('wdSubmit').onclick = submitWithdraw;
}

async function submitWithdraw(){
  const err = document.getElementById('wdErr');
  const method = document.querySelector('#withdrawModal .method-btn.sel')?.dataset.method || 'telebirr';
  const amount = Number(document.getElementById('wdAmount').value);
  const phone = document.getElementById('wdPhone').value.trim();
  const available = (myProfile?.balance || 0) + (myProfile?.winBalance || 0);

  if (!amount || amount < 100){ err.innerText = '⚠️ Minimum 100 ETB'; return; }
  if (amount > available){ err.innerText = '❌ Exceeds available balance'; return; }
  if (!phone || phone.length < 9){ err.innerText = '⚠️ Enter valid phone'; return; }

  const btn = document.getElementById('wdSubmit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Sending…';

  try {
    const r = await fetch('/api/withdraw/request', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ userId, amount, method, phone })
    }).then(x=>x.json());
    if (r.success){
      closeModal('withdrawModal');
      toast('✅ Withdraw sent to admin');
      loadProfile();
      loadHistory(1);
    } else {
      err.innerText = '❌ ' + (r.error || 'failed');
      btn.disabled = false;
      btn.innerText = 'Request Withdraw';
    }
  } catch(e){
    err.innerText = '❌ Network error';
    btn.disabled = false;
    btn.innerText = 'Request Withdraw';
  }
}

function closeModal(id){
  const el = document.getElementById(id);
  if (el) el.remove();
}

loadProfile();
loadHistory(1);
if (initialTab === 'leader') switchTab('leader');
</script>
</body>
</html>
