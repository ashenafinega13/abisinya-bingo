<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0616" />
<title>Abyssinia Bingo Bot</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root{
    --bg-0:#0b0616; --bg-1:#130c26; --bg-2:#1a1035; --bg-3:#241649;
    --ink:#f5f3ff; --muted:#a78bfa; --accent:#8b5cf6; --accent-2:#a855f7;
    --neon-pink:#ec4899; --neon-cyan:#22d3ee; --neon-green:#22c55e;
    --neon-orange:#fb923c; --neon-gold:#facc15; --border:rgba(167,139,250,.18);
    --colB:#f97316; --colI:#10b981; --colN:#3b82f6; --colG:#ef4444; --colO:#a855f7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:'Inter','Segoe UI',sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -100px, rgba(168,85,247,.18), transparent 60%),
      linear-gradient(160deg,var(--bg-0) 0%,var(--bg-1) 40%,var(--bg-2) 100%);
    background-attachment:fixed;
    color:var(--ink);
    height:100vh; height:100dvh;
    padding:6px;
    padding-top:calc(env(safe-area-inset-top) + 6px);
    padding-bottom:calc(env(safe-area-inset-bottom) + 6px);
    display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ WELCOME SPLASH ============ */
  #splash{
    position:fixed;inset:0;z-index:500;
    background:
      radial-gradient(1200px 600px at 50% -100px, rgba(168,85,247,.28), transparent 60%),
      linear-gradient(160deg,var(--bg-0) 0%,var(--bg-1) 40%,var(--bg-2) 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;text-align:center;padding:30px;
    animation:fade-in .4s;
  }
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
  #splash.hide{animation:fade-out .5s forwards}
  @keyframes fade-out{to{opacity:0;visibility:hidden}}
  .splash-logo{
    width:88px;height:88px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #fff2b0, var(--neon-gold) 45%, #b45309 100%);
    display:flex;align-items:center;justify-content:center;
    font-size:40px;font-weight:900;color:#1a0a2e;
    box-shadow:0 0 40px rgba(250,204,21,.6);
    animation:spin-pulse 2s infinite;
  }
  @keyframes spin-pulse{
    0%,100%{transform:scale(1) rotate(0deg)}
    50%{transform:scale(1.1) rotate(10deg)}
  }
  .splash-title{
    font-size:26px;font-weight:900;letter-spacing:1px;
    background:linear-gradient(135deg,var(--neon-gold),var(--neon-pink),var(--neon-cyan));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
    text-align:center;line-height:1.2;
  }
  .splash-sub{
    font-size:13px;color:var(--muted);max-width:280px;
  }
  .splash-loader{
    display:flex;gap:6px;margin-top:10px;
  }
  .splash-loader span{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    animation:dot-bounce 1.4s infinite ease-in-out both;
  }
  .splash-loader span:nth-child(1){animation-delay:-0.32s;background:var(--neon-pink)}
  .splash-loader span:nth-child(2){animation-delay:-0.16s;background:var(--neon-gold)}
  .splash-loader span:nth-child(3){animation-delay:0s;background:var(--neon-cyan)}
  @keyframes dot-bounce{
    0%,80%,100%{transform:scale(.5);opacity:.5}
    40%{transform:scale(1.2);opacity:1}
  }
  .splash-status{
    font-size:11px;color:var(--muted);margin-top:6px;
    font-family:monospace;letter-spacing:.5px;
  }

  /* ============ MAIN CONTAINER ============ */
  .container{
    width:100%; max-width:1200px; margin:0 auto;
    display:flex; flex-direction:column;
    height:100%; overflow:hidden; gap:6px;
  }

  /* TOP BAR */
  .topbar{
    display:grid;grid-template-columns:repeat(5,1fr);gap:4px;flex-shrink:0;
  }
  .stat{
    background:linear-gradient(180deg,rgba(139,92,246,.14),rgba(139,92,246,.05));
    border:1px solid var(--border);border-radius:8px;
    padding:5px 2px;text-align:center;
  }
  .stat small{font-size:8px;color:var(--muted);font-weight:800;
              letter-spacing:.4px;text-transform:uppercase;display:block}
  .stat b{font-size:13px;color:var(--ink);font-weight:800;display:block}
  .stat.purple b{color:var(--neon-pink)}

  /* MAIN GRID — BOARD + SIDE PANEL */
  .main-grid{
    flex:1 1 auto; min-height:0;
    display:grid;
    grid-template-columns: 1fr 320px;
    gap:8px;
    overflow:hidden;
  }
  @media (max-width: 720px){
    .main-grid{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  }

  /* ============ LEFT: B-I-N-G-O BOARD ============ */
  .board-panel{
    background:linear-gradient(180deg,rgba(30,20,60,.45),rgba(20,12,40,.45));
    border:1px solid var(--border);
    border-radius:12px;
    padding:8px;
    display:flex; flex-direction:column;
    gap:6px; overflow:hidden; min-height:0;
  }
  .board-header{
    display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
    flex-shrink:0;
  }
  .bh{
    padding:8px 0;text-align:center;font-weight:900;font-size:18px;color:#fff;
    border-radius:8px;text-shadow:0 1px 3px rgba(0,0,0,.4);
    transition:opacity .3s,transform .2s; position:relative;
  }
  .bh.b{background:linear-gradient(135deg,#f97316,#ea580c)}
  .bh.i{background:linear-gradient(135deg,#10b981,#047857)}
  .bh.n{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
  .bh.g{background:linear-gradient(135deg,#ef4444,#b91c1c)}
  .bh.o{background:linear-gradient(135deg,#a855f7,#7e22ce)}
  .bh small{
    display:block;font-size:9px;font-weight:700;opacity:.75;
    letter-spacing:1px;margin-top:1px;
  }
  .bh.active{transform:scale(1.06);box-shadow:0 0 16px currentColor}

  /* THE 5-COLUMN NUMBER GRID */
  .number-grid{
    flex:1 1 auto; display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(15,1fr);
    gap:3px; min-height:0;
  }
  .num-cell{
    display:flex;align-items:center;justify-content:center;
    font-weight:800;
    font-size:clamp(10px, 1.8vw, 15px);
    border-radius:6px;
    background:rgba(139,92,246,.08);
    color:rgba(245,243,255,.55);
    border:1px solid rgba(167,139,250,.08);
    transition:all .3s cubic-bezier(.2,1.4,.5,1);
    user-select:none;line-height:1;
  }
  .num-cell.called{
    background:linear-gradient(135deg,var(--neon-orange),#ea580c);
    color:#fff;font-weight:900;
    border-color:transparent;
    box-shadow:0 0 12px rgba(251,146,60,.55);
    transform:scale(1.05);
  }
  .num-cell.latest{
    background:linear-gradient(135deg,var(--neon-gold),#eab308);
    color:#1a0a2e;font-weight:900;
    border:2px solid #fff;
    box-shadow:0 0 20px rgba(250,204,21,.9);
    animation:pulse-latest .8s infinite alternate;
  }
  @keyframes pulse-latest{
    from{transform:scale(1.05)}
    to{transform:scale(1.12)}
  }

  /* ============ RIGHT: SIDE PANEL ============ */
  .side-panel{
    display:flex;flex-direction:column;gap:6px;
    overflow:hidden; min-height:0;
  }

  /* LIVE CALL PANEL */
  .live-panel{
    background:
      radial-gradient(circle at 30% 50%, rgba(168,85,247,.25), transparent 60%),
      linear-gradient(135deg, rgba(30,20,60,.9), rgba(20,12,40,.9));
    border:1px solid rgba(168,85,247,.45);
    border-radius:12px;padding:10px;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
    box-shadow:0 0 22px rgba(168,85,247,.35);
    flex-shrink:0; min-height:76px;
  }
  .live-panel .label{
    font-size:9px;color:var(--muted);font-weight:800;
    letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px;
  }
  .live-panel .txt{
    font-size:22px;font-weight:900;letter-spacing:.5px;
    background:linear-gradient(135deg,#fff,var(--neon-cyan));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text; line-height:1;
    transition:transform .25s;
  }
  .live-panel .txt.pop{transform:scale(1.15)}
  .live-ball{
    width:60px;height:60px;border-radius:50%;
    background:radial-gradient(circle at 28% 28%, #fff2b0, var(--neon-gold) 45%, #b45309 100%);
    display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:900;color:#1a0a2e;
    box-shadow:0 0 22px rgba(250,204,21,.7),inset 0 -3px 6px rgba(0,0,0,.25);
    transition:transform .3s cubic-bezier(.2,1.6,.4,1);
    flex-shrink:0;
  }
  .live-ball.pop{transform:scale(1.15)}

  /* RECENT CALLS */
  .recent-panel{
    background:linear-gradient(180deg,rgba(30,20,60,.55),rgba(20,12,40,.55));
    border:1px solid var(--border);border-radius:12px;
    padding:8px; flex-shrink:0;
  }
  .recent-panel .hdr-sm{
    font-size:9px;font-weight:800;color:var(--muted);
    letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;
  }
  .recent-list{display:flex;flex-wrap:wrap;gap:4px}
  .recent-chip{
    width:32px;height:32px;border-radius:8px;
    background:rgba(139,92,246,.18);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:11px;color:var(--ink);
    animation:pop-in .35s;
  }
  .recent-chip.newest{
    background:linear-gradient(135deg,var(--neon-gold),#eab308);
    color:#1a0a2e;border-color:#fff;
    box-shadow:0 0 12px rgba(250,204,21,.6);
  }
  @keyframes pop-in{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

  /* STATS INSIDE SIDE PANEL */
  .stats-mini{
    display:grid;grid-template-columns:1fr 1fr;gap:6px;
    flex-shrink:0;
  }
  .stat-mini{
    background:linear-gradient(180deg,rgba(139,92,246,.14),rgba(139,92,246,.05));
    border:1px solid var(--border);border-radius:10px;
    padding:8px 10px;text-align:center;
  }
  .stat-mini small{
    display:block;font-size:8px;font-weight:800;letter-spacing:.6px;
    text-transform:uppercase;color:var(--muted);margin-bottom:2px;
  }
  .stat-mini b{font-size:15px;font-weight:900;color:var(--ink)}
  .stat-mini.gold b{color:var(--neon-gold)}
  .stat-mini.cyan b{color:var(--neon-cyan)}

  /* PROGRESS */
  .progress{
    height:4px;background:rgba(139,92,246,.15);border-radius:4px;
    overflow:hidden;flex-shrink:0;
  }
  .progress-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--neon-cyan),var(--neon-pink),var(--neon-gold));
    transition:width .5s;box-shadow:0 0 8px rgba(236,72,153,.5);
  }

  /* CARTELAS IN SIDE PANEL */
  .cartelas-panel{
    flex:1 1 auto; min-height:0;
    overflow-y:auto;
    display:flex;flex-direction:column;gap:6px;
    padding-right:2px;
  }
  .cartelas-panel::-webkit-scrollbar{width:4px}
  .cartelas-panel::-webkit-scrollbar-thumb{
    background:rgba(167,139,250,.4);border-radius:4px;
  }
  .board{
    background:linear-gradient(180deg,rgba(30,20,60,.55),rgba(20,12,40,.55));
    border:1px solid var(--border);border-radius:10px;
    padding:4px; flex-shrink:0;
  }
  .board-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:2px 4px 4px; font-size:9px;color:var(--muted);font-weight:800;
    letter-spacing:.6px;
  }
  .board-grid{
    display:grid;grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);gap:2px;
  }
  .cell{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-weight:800; font-size:clamp(10px,1.6vw,13px);
    border-radius:5px; background:rgba(139,92,246,.10);
    color:var(--ink); border:1px solid rgba(167,139,250,.12);
    transition:background .3s,color .3s,transform .18s,box-shadow .3s;
    user-select:none;line-height:1;
  }
  .cell.marked{
    background:linear-gradient(135deg,var(--neon-orange),#ea580c);
    color:#fff;border-color:transparent;
    box-shadow:0 0 8px rgba(251,146,60,.55);
    animation:mark-pop .4s cubic-bezier(.2,1.6,.5,1);
  }
  @keyframes mark-pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
  .cell.win{
    background:linear-gradient(135deg,var(--neon-gold),#eab308);
    color:#1a0a2e;border:1px solid #fff;
    box-shadow:0 0 12px rgba(250,204,21,.85);
  }

  /* BOTTOM BAR */
  .bottom-bar{display:flex;gap:6px;flex-shrink:0}
  .bottom-bar button{
    flex:1;padding:8px;border-radius:10px;border:none;
    font-weight:800;font-size:12px;cursor:pointer;transition:all .15s;
  }
  .bottom-bar .btn-bingo{
    background:linear-gradient(135deg,#ec4899,#be185d);color:#fff;
    box-shadow:0 4px 12px rgba(236,72,153,.45);font-size:14px;
  }
  .bottom-bar .btn-bingo:disabled{background:#444;box-shadow:none;cursor:not-allowed}
  .bottom-bar .btn-ghost{
    background:rgba(139,92,246,.15);color:var(--ink);
    border:1px solid var(--border);flex:0 0 auto;padding:8px 12px;
  }
  .bottom-bar .btn-ghost.on{
    background:linear-gradient(135deg,var(--neon-green),#10b981);
    color:#0b0616;border-color:transparent;
  }

  /* PICKER (selection screen) */
  .picker-wrap{flex:1;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .picker-header{
    display:flex;justify-content:space-between;align-items:center;
    gap:8px;flex-shrink:0;
  }
  .picker-countdown{
    background:linear-gradient(135deg,var(--neon-cyan),var(--accent));
    color:#0b0616;border-radius:10px;padding:8px 20px;
    font-size:22px;font-weight:900;letter-spacing:2px;
    box-shadow:0 4px 14px rgba(34,211,238,.4);
    min-width:80px;text-align:center;
  }
  .picker-countdown.low{
    background:linear-gradient(135deg,var(--neon-pink),#b91c1c);
    color:#fff;animation:pulse-low .9s infinite;
  }
  @keyframes pulse-low{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
  .picker{
    flex:1;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(40px,1fr));
    gap:4px;overflow-y:auto;padding:8px;
    background:linear-gradient(180deg,rgba(30,20,60,.55),rgba(20,12,40,.55));
    border-radius:10px;border:1px solid var(--border);
    -webkit-overflow-scrolling:touch;
  }
  .pick{
    padding:7px 0;background:rgba(139,92,246,.10);
    border:1px solid rgba(167,139,250,.15);border-radius:6px;
    text-align:center;font-weight:800;font-size:11px;color:var(--ink);
    cursor:pointer;transition:all .15s;user-select:none;
  }
  .pick:active{transform:scale(.94)}
  .pick.sel{
    background:linear-gradient(135deg,var(--neon-pink),var(--accent-2));
    color:#fff;border-color:transparent;transform:scale(1.08);
    box-shadow:0 0 12px rgba(236,72,153,.65);
  }
  .pick.taken{background:rgba(34,197,94,.15);color:rgba(34,197,94,.65);
              border-color:rgba(34,197,94,.3);cursor:not-allowed;text-decoration:line-through}
  .pick.mine{background:linear-gradient(135deg,var(--neon-cyan),var(--accent));
             color:#0b0616;border-color:transparent;
             box-shadow:0 0 12px rgba(34,211,238,.55)}

  .action-btn{
    width:100%;padding:11px;
    background:linear-gradient(135deg,var(--accent),var(--neon-pink));
    color:#fff;border:none;border-radius:10px;
    font-size:14px;font-weight:900;cursor:pointer;
    box-shadow:0 4px 12px rgba(168,85,247,.4);
    transition:all .15s;flex-shrink:0;
  }
  .action-btn:disabled{background:rgba(139,92,246,.15);color:rgba(167,139,250,.5);cursor:not-allowed;box-shadow:none}
  .action-btn:not(:disabled):active{transform:scale(.98)}

  .msg{
    background:linear-gradient(180deg,rgba(30,20,60,.55),rgba(20,12,40,.55));
    border:1px solid var(--border);border-radius:10px;
    padding:10px;text-align:center;font-size:11px;font-weight:600;
    color:var(--muted);flex-shrink:0;
  }
  .msg.good{color:var(--neon-green);border-color:rgba(34,197,94,.4)}

  /* ICON BAR */
  .icon-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;flex-shrink:0}
  .icon-bar button{
    padding:6px 2px;border-radius:8px;
    background:rgba(139,92,246,.10);border:1px solid var(--border);
    color:var(--ink);font-size:14px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:1px;
    transition:all .15s;
  }
  .icon-bar button small{font-size:8px;color:var(--muted);font-weight:700}
  .icon-bar button:active{transform:scale(.95)}

  /* MODAL */
  .modal-bg{
    position:fixed;inset:0;background:rgba(10,5,25,.88);
    backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:16px;animation:fade-in .25s;
  }
  .modal{
    background:linear-gradient(160deg,var(--bg-3),var(--bg-2));
    border:1px solid rgba(168,85,247,.4);
    border-radius:16px;padding:20px;text-align:center;
    max-width:400px;width:100%;
    box-shadow:0 0 40px rgba(168,85,247,.35);
    animation:pop-modal .4s cubic-bezier(.2,1.4,.5,1);
  }
  @keyframes pop-modal{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h1{
    font-size:22px;font-weight:900;letter-spacing:2px;font-style:italic;
    background:linear-gradient(135deg,var(--neon-gold),var(--neon-pink));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;margin-bottom:10px;
  }
  .modal .winner-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:linear-gradient(135deg,var(--neon-pink),#be185d);
    color:#fff;padding:6px 14px;border-radius:8px;
    font-weight:900;font-size:14px;margin-bottom:12px;
  }
  .modal .pool-label{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
  .modal .pool-amount{
    font-size:34px;font-weight:900;color:var(--neon-gold);
    margin-bottom:14px;text-shadow:0 0 16px rgba(250,204,21,.5);
  }
  .modal .pool-amount small{font-size:16px;color:var(--muted)}

  /* TOAST */
  .toast{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    background:rgba(20,10,40,.95);border:1px solid rgba(168,85,247,.4);
    color:var(--ink);padding:10px 18px;border-radius:10px;
    font-size:12px;font-weight:700;z-index:99;
    box-shadow:0 0 20px rgba(168,85,247,.4);
    animation:toast-in .25s;max-width:90%;text-align:center;
  }
  @keyframes toast-in{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

  .confetti{position:fixed;width:8px;height:8px;top:-20px;z-index:98;pointer-events:none;border-radius:2px}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

  .hidden{display:none !important}
</style>
</head>
<body>

<!-- WELCOME SPLASH — appears instantly, never shows Render's screen -->
<div id="splash">
  <div class="splash-logo">🎯</div>
  <div class="splash-title">Welcome to<br>Abyssinia Bingo Bot</div>
  <div class="splash-sub">Connecting to the game server…</div>
  <div class="splash-loader"><span></span><span></span><span></span></div>
  <div class="splash-status" id="splashStatus">Initializing…</div>
</div>

<script>
  // Telegram WebApp init
  if (window.Telegram && window.Telegram.WebApp) {
    const tw = window.Telegram.WebApp;
    tw.expand();
    tw.disableVerticalSwipes?.();
    tw.setHeaderColor?.('#0b0616');
    tw.setBackgroundColor?.('#0b0616');
    tw.enableClosingConfirmation?.();
  }

  // Splash status updater
  const splashStatus = document.getElementById('splashStatus');
  const splashSteps = [
    'Initializing…',
    'Connecting to server…',
    'Loading cartelas…',
    'Almost ready…'
  ];
  let splashStep = 0;
  const splashTimer = setInterval(() => {
    if (splashStep < splashSteps.length - 1) splashStep++;
    if (splashStatus) splashStatus.innerText = splashSteps[splashStep];
  }, 1500);

  function hideSplash(){
    clearInterval(splashTimer);
    const s = document.getElementById('splash');
    if (s) s.classList.add('hide');
    setTimeout(() => { if (s) s.remove(); }, 600);
  }
</script>

<div class="container">
  <div class="topbar">
    <div class="stat purple"><small>PRIZE</small><b id="derashLbl">0</b></div>
    <div class="stat"><small>PLAYERS</small><b id="playersLbl">0</b></div>
    <div class="stat"><small>BET</small><b id="betLbl">10</b></div>
    <div class="stat"><small>CALL</small><b id="callLbl">--</b></div>
    <div class="stat"><small>GAME №</small><b id="gameNoLbl">1</b></div>
  </div>

  <!-- SELECTION SCREEN -->
  <div id="selectScreen" class="picker-wrap hidden">
    <div class="picker-header">
      <div style="flex:1">
        <div style="font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.6px;text-transform:uppercase">Choose Cartelas</div>
        <div style="font-size:15px;font-weight:900;color:var(--ink);margin-top:2px">
          <span id="selCount">0</span>/6 · Pool: <span id="prizeSelLbl" style="color:var(--neon-gold)">0 ETB</span>
        </div>
      </div>
      <div class="picker-countdown" id="countdownBtn">--</div>
    </div>
    <div class="picker" id="picker"></div>
    <button class="action-btn" id="joinBtn" disabled>🎯 JOIN GAME</button>
    <div class="msg" id="selMsg">Pick 1–6 cartelas then tap JOIN</div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="hidden" style="flex:1;display:flex;flex-direction:column;gap:6px;min-height:0">
    <div class="main-grid">

      <!-- LEFT: B-I-N-G-O BOARD -->
      <div class="board-panel">
        <div class="board-header">
          <div class="bh b" data-col="0">B<small>1-15</small></div>
          <div class="bh i" data-col="1">I<small>16-30</small></div>
          <div class="bh n" data-col="2">N<small>31-45</small></div>
          <div class="bh g" data-col="3">G<small>46-60</small></div>
          <div class="bh o" data-col="4">O<small>61-75</small></div>
        </div>
        <div class="number-grid" id="numberGrid"></div>
      </div>

      <!-- RIGHT: SIDE PANEL -->
      <div class="side-panel">

        <!-- CURRENT CALL -->
        <div class="live-panel">
          <div>
            <div class="label">Current Call</div>
            <div class="txt" id="liveCallTxt">--</div>
          </div>
          <div class="live-ball" id="liveBall">--</div>
        </div>

        <!-- STATUS -->
        <div class="stats-mini">
          <div class="stat-mini gold">
            <small>Prize Pool</small>
            <b id="prizeLbl">0 ETB</b>
          </div>
          <div class="stat-mini cyan">
            <small>Players</small>
            <b id="playersInGame">0</b>
          </div>
        </div>

        <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

        <!-- RECENT CALLS -->
        <div class="recent-panel">
          <div class="hdr-sm">Last Calls</div>
          <div class="recent-list" id="recentList"></div>
        </div>

        <!-- CARTELAS -->
        <div class="cartelas-panel" id="cartelasWrap"></div>

        <!-- BOTTOM ACTIONS -->
        <div class="bottom-bar">
          <button class="btn-bingo" id="bingoBtn" disabled>🎉 BINGO!</button>
          <button class="btn-ghost" id="autoBingoBtn" title="Auto Bingo">⚡</button>
        </div>

        <!-- ICON BAR -->
        <div class="icon-bar">
          <button id="btnWallet"><span>💼</span><small>Wallet</small></button>
          <button id="btnBalance"><span>💵</span><small>Balance</small></button>
          <button id="btnHistory"><span>📜</span><small>History</small></button>
          <button id="btnInvite"><span>🎁</span><small>Invite</small></button>
          <button id="btnLang"><span>🌐</span><small>Lang</small></button>
          <button id="btnHelp"><span>❓</span><small>Help</small></button>
        </div>
      </div>
    </div>
  </div>
</div>

<button id="enableVoiceBtn" style="position:fixed;top:6px;right:6px;z-index:200;
  background:linear-gradient(135deg,var(--neon-green),#10b981);color:#0b0616;
  border:none;padding:6px 10px;border-radius:8px;font-weight:900;font-size:11px;cursor:pointer">
  🔊 Enable Voice
</button>

<script>
// ============ PARAMS ============
const p = new URLSearchParams(location.search);
const userId = Number(p.get('uid')) || 0;
const firstName = p.get('name') || 'Player';
const socket = io();

// ============ VOICE — PRE-RECORDED MALE MP3s ============
let voiceEnabled = false;
const audioCache = new Map();

function preloadAudio(num){
  if (audioCache.has(num)) return audioCache.get(num);
  const a = new Audio('/audio/call_' + num + '.mp3');
  a.preload = 'auto';
  audioCache.set(num, a);
  return a;
}

setTimeout(() => {
  for (let n = 1; n <= 75; n++) preloadAudio(n);
  console.log('🎙️ Preloaded 75 MP3 announcements');
}, 2000);

function playCall(number){
  if (!voiceEnabled) return;
  try {
    const a = preloadAudio(number);
    a.currentTime = 0;
    a.volume = 1.0;
    const pr = a.play();
    if (pr && pr.catch) pr.catch(err => console.log('audio play err:', err.message));
  } catch(e){ console.error('playCall:', e); }
}

function playEventAudio(text){
  if (!voiceEnabled) return;
  if ('speechSynthesis' in window) {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.pitch = 0.5; u.rate = 0.95;
      speechSynthesis.speak(u);
    } catch(e){}
  }
}

document.getElementById('enableVoiceBtn').onclick = () => {
  voiceEnabled = true;
  document.getElementById('enableVoiceBtn').style.display = 'none';
  chime(880, 0.15, 0.08);
  setTimeout(() => playCall(12), 300);
  showToast('🔊 Voice enabled');
  localStorage.setItem('voiceEnabled', '1');
};

if (localStorage.getItem('voiceEnabled') === '1') {
  const autoEnable = () => {
    if (!voiceEnabled) {
      voiceEnabled = true;
      const btn = document.getElementById('enableVoiceBtn');
      if (btn) btn.style.display = 'none';
    }
    document.removeEventListener('touchstart', autoEnable);
    document.removeEventListener('click', autoEnable);
  };
  document.addEventListener('touchstart', autoEnable, { once: true });
  document.addEventListener('click', autoEnable, { once: true });
}

// ============ TONES ============
function chime(freq, dur, vol=0.06, type='sine'){
  try {
    if (!window._ac) window._ac = new (window.AudioContext||window.webkitAudioContext)();
    const ac = window._ac;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch(e){}
}
function playWinSound(){
  [523, 659, 784, 1047, 1319].forEach((f,i)=>setTimeout(()=>chime(f, 0.28, 0.11, 'triangle'), i*130));
}

function letterOf(n){
  if (n <= 15) return 'B';
  if (n <= 30) return 'I';
  if (n <= 45) return 'N';
  if (n <= 60) return 'G';
  return 'O';
}

// ============ SOCKET ============
socket.on('connect', () => {
  socket.emit('join-room');
  loadState();
  loadMyCartelas();
});

// ============ STATE ============
let phase = 'selection';
let selected = [];
let myCartelas = [];
let calledNumbers = [];
let takenSet = new Set();
let availableCartelas = 600;
let fee = 10;
let selectionEndsAt = 0;
let cdTimer = null;
let autoBingo = localStorage.getItem('autoBingo') === '1';

async function loadState(){
  try {
    const r = await fetch('/api/game').then(x=>x.json());
    fee = r.entryFee || 10;
    availableCartelas = r.cartelaCount || 600;
    document.getElementById('betLbl').innerText = fee;
    applyState(r);
  } catch(e){}
}
async function loadMyCartelas(){
  try {
    const r = await fetch('/api/my-cartelas/' + userId).then(x=>x.json());
    if (r.success && r.cartelas && r.cartelas.length){
      myCartelas = r.cartelas;
      showGameScreen();
      renderCartelas();
    }
  } catch(e){}
}

function applyState(s){
  phase = s.phase;
  takenSet = new Set(s.takenCartelas || []);
  calledNumbers = s.calledNumbers || [];
  selectionEndsAt = s.selectionEndsAt || 0;

  document.getElementById('prizeLbl').innerText = (s.prizePool||0) + ' ETB';
  document.getElementById('prizeSelLbl').innerText = (s.prizePool||0) + ' ETB';
  document.getElementById('playersLbl').innerText = s.playerCount || 0;
  document.getElementById('playersInGame').innerText = s.playerCount || 0;
  document.getElementById('derashLbl').innerText = (s.prizePool||0) + ' ETB';
  document.getElementById('gameNoLbl').innerText = '#' + (s.roundId || 1);
  document.getElementById('callLbl').innerText = s.currentCall ? letterOf(s.currentCall)+'-'+s.currentCall : '--';

  if (phase === 'selection'){
    if (myCartelas.length === 0){
      showSelectionScreen();
      startCountdownUI(s.selectionEndsAt);
    } else {
      showGameScreen();
    }
  } else {
    showGameScreen();
  }

  if (s.currentCall){
    document.getElementById('liveBall').innerText = s.currentCall;
    document.getElementById('liveCallTxt').innerText = letterOf(s.currentCall)+' - '+s.currentCall;
  }

  renderRecent();
  renderPicker();
  renderCartelas();
  renderNumberGrid();
  updateProgress();
  updateColumnHighlights();
}

// ============ COUNTDOWN ============
function startCountdownUI(endsAt){
  clearInterval(cdTimer);
  const btn = document.getElementById('countdownBtn');
  const tick = () => {
    const left = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
    btn.innerText = left > 0 ? left : 'START';
    btn.classList.toggle('low', left <= 5 && left > 0);
    if (left <= 0) clearInterval(cdTimer);
  };
  tick();
  cdTimer = setInterval(tick, 250);
}

// ============ NUMBER GRID (LEFT PANEL) ============
function renderNumberGrid(){
  const grid = document.getElementById('numberGrid');
  if (!grid) return;
  if (grid.children.length === 0){
    // Build 5 columns × 15 rows
    // Cell order: for row r (0-14), for col c (0-4), number = c*15 + r + 1
    for (let r = 0; r < 15; r++){
      for (let c = 0; c < 5; c++){
        const num = c*15 + r + 1;
        const d = document.createElement('div');
        d.className = 'num-cell';
        d.dataset.n = num;
        d.dataset.col = c;
        d.innerText = num;
        grid.appendChild(d);
      }
    }
  }
  const calledSet = new Set(calledNumbers);
  const latest = calledNumbers[calledNumbers.length - 1];
  for (const cell of grid.children){
    const num = Number(cell.dataset.n);
    cell.classList.toggle('called', calledSet.has(num));
    cell.classList.toggle('latest', num === latest);
  }
}

// ============ PICKER ============
function renderPicker(){
  const el = document.getElementById('picker');
  if (!el) return;
  if (el.children.length !== availableCartelas){
    el.innerHTML = '';
    for (let i = 1; i <= availableCartelas; i++){
      const d = document.createElement('div');
      d.className = 'pick'; d.dataset.id = i; d.innerText = i;
      d.onclick = () => onPickClick(i);
      el.appendChild(d);
    }
  }
  for (const d of el.children){
    const id = Number(d.dataset.id);
    const taken = takenSet.has(id);
    const mine = myCartelas.some(c => c.id === id);
    const sel = selected.includes(id);
    d.className = 'pick';
    if (mine) d.classList.add('mine');
    else if (taken) d.classList.add('taken');
    else if (sel) d.classList.add('sel');
  }
  document.getElementById('joinBtn').disabled = selected.length === 0;
  document.getElementById('selCount').innerText = selected.length;
  if (selected.length > 0){
    document.getElementById('selMsg').innerText = selected.length + '/6 selected — tap JOIN';
  } else {
    document.getElementById('selMsg').innerText = 'Pick 1–6 cartelas then tap JOIN';
  }
}
function onPickClick(id){
  if (phase !== 'selection') return;
  if (takenSet.has(id)) { showToast('⚠️ Cartela taken'); return; }
  if (myCartelas.some(c => c.id === id)) { showToast('Already yours'); return; }
  const i = selected.indexOf(id);
  if (i >= 0) selected.splice(i, 1);
  else if (selected.length >= 6) { showToast('⚠️ Max 6 cartelas'); return; }
  else selected.push(id);
  chime(660, 0.1, 0.05, 'triangle');
  renderPicker();
}

// ============ CARTELAS (RIGHT PANEL) ============
function renderCartelas(){
  const wrap = document.getElementById('cartelasWrap');
  if (!wrap) return;
  const sig = myCartelas.map(c=>c.id).join(',');
  if (wrap.dataset.sig === sig){
    myCartelas.forEach(updateCartelaCells);
    return;
  }
  wrap.innerHTML = '';
  wrap.dataset.sig = sig;
  myCartelas.forEach(c => {
    const card = document.createElement('div');
    card.className = 'board';
    card.id = 'cartela-' + c.id;
    card.innerHTML = `<div class="board-head"><span>CARTELA #${c.id}</span></div>`;
    const grid = document.createElement('div');
    grid.className = 'board-grid';
    for (let r = 0; r < 5; r++){
      for (let col = 0; col < 5; col++){
        const n = c.grid[r][col];
        const d = document.createElement('div');
        d.className = 'cell';
        d.dataset.n = n;
        d.innerText = n === 0 ? '★' : n;
        grid.appendChild(d);
      }
    }
    card.appendChild(grid);
    wrap.appendChild(card);
    updateCartelaCells(c);
  });
}
function updateCartelaCells(cartela){
  const card = document.getElementById('cartela-' + cartela.id);
  if (!card) return;
  const called = new Set(calledNumbers); called.add(0);
  card.querySelectorAll('.cell[data-n]').forEach(el => {
    const n = Number(el.dataset.n);
    if (called.has(n)) el.classList.add('marked');
    else el.classList.remove('marked');
  });
  const winInfo = evaluateWinClient(cartela, called);
  if (winInfo){
    card.querySelectorAll('.cell[data-n]').forEach(el => {
      const n = Number(el.dataset.n);
      if (winInfo.cells.includes(n)) el.classList.add('win');
      else el.classList.remove('win');
    });
  } else {
    card.querySelectorAll('.cell.win').forEach(el => el.classList.remove('win'));
  }
}

// ============ WIN CHECKER ============
function evaluateWinClient(cartela, calledSet){
  const g = cartela.grid;
  for (let r=0;r<5;r++){
    const cells = []; let ok = true;
    for (let c=0;c<5;c++){
      const n = g[r][c]; cells.push(n);
      if (n !== 0 && !calledSet.has(n)){ ok=false; break; }
    }
    if (ok) return { pattern: 'row:'+r, cells };
  }
  for (let c=0;c<5;c++){
    const cells = []; let ok = true;
    for (let r=0;r<5;r++){
      const n = g[r][c]; cells.push(n);
      if (n !== 0 && !calledSet.has(n)){ ok=false; break; }
    }
    if (ok) return { pattern: 'col:'+c, cells };
  }
  let cells = []; let ok = true;
  for (let i=0;i<5;i++){
    const n = g[i][i]; cells.push(n);
    if (n !== 0 && !calledSet.has(n)){ ok=false; break; }
  }
  if (ok) return { pattern: 'diag:main', cells };
  cells = []; ok = true;
  for (let i=0;i<5;i++){
    const n = g[i][4-i]; cells.push(n);
    if (n !== 0 && !calledSet.has(n)){ ok=false; break; }
  }
  if (ok) return { pattern: 'diag:anti', cells };
  return null;
}

// ============ LIVE CALL ============
function setLiveCall(num){
  const ball = document.getElementById('liveBall');
  const txt = document.getElementById('liveCallTxt');
  ball.innerText = num;
  txt.innerText = letterOf(num) + ' - ' + num;
  ball.classList.add('pop'); txt.classList.add('pop');
  setTimeout(()=>{ ball.classList.remove('pop'); txt.classList.remove('pop'); }, 300);
}
function renderRecent(){
  const el = document.getElementById('recentList');
  if (!el) return;
  el.innerHTML = '';
  calledNumbers.slice(-8).reverse().forEach((n, idx) => {
    const d = document.createElement('div');
    d.className = 'recent-chip' + (idx === 0 ? ' newest' : '');
    d.innerText = n;
    el.appendChild(d);
  });
}
function updateProgress(){
  const f = document.getElementById('progressFill');
  if (!f) return;
  f.style.width = Math.min(100, (calledNumbers.length/75)*100) + '%';
}
function updateColumnHighlights(){
  const ranges = [[1,15],[16,30],[31,45],[46,60],[61,75]];
  const latest = calledNumbers[calledNumbers.length - 1];
  document.querySelectorAll('.bh').forEach((h, idx) => {
    const [mn, mx] = ranges[idx];
    h.classList.toggle('active', latest !== undefined && latest >= mn && latest <= mx);
  });
}

// ============ SCREENS ============
function showSelectionScreen(){
  document.getElementById('selectScreen').classList.remove('hidden');
  document.getElementById('selectScreen').style.display = 'flex';
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('gameScreen').style.display = 'none';
}
function showGameScreen(){
  document.getElementById('selectScreen').classList.add('hidden');
  document.getElementById('selectScreen').style.display = 'none';
  document.getElementById('gameScreen').classList.remove('hidden');
  document.getElementById('gameScreen').style.display = 'flex';
}

// ============ JOIN ============
document.getElementById('joinBtn').onclick = async () => {
  if (selected.length === 0) return;
  document.getElementById('selMsg').innerText = 'Joining…';
  try {
    const r = await fetch('/api/player/join', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({userId, firstName, cartelaIds: selected})
    }).then(x=>x.json());
    if (!r.success){ document.getElementById('selMsg').innerText = '❌ '+r.error; return; }
    myCartelas = r.cartelas;
    chime(660, 0.14, 0.08, 'triangle');
    showToast('✅ Joined!');
    showGameScreen();
    renderCartelas();
    renderNumberGrid();
  } catch(e){ document.getElementById('selMsg').innerText = '❌ Network error'; }
};

// ============ BINGO ============
document.getElementById('bingoBtn').onclick = () => tryClaimBingo();
async function tryClaimBingo(){
  const called = new Set(calledNumbers); called.add(0);
  for (const c of myCartelas){
    const w = evaluateWinClient(c, called);
    if (w){
      try {
        const r = await fetch('/api/player/bingo', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({userId, cartelaId: c.id})
        }).then(x=>x.json());
        if (r.success) playEventAudio('Bingo!');
        else showToast('❌ ' + r.error);
      } catch(e){}
      return;
    }
  }
  showToast('⚠️ No complete line yet');
}
function checkAutoBingo(){
  if (!autoBingo) return;
  const called = new Set(calledNumbers); called.add(0);
  for (const c of myCartelas){
    const w = evaluateWinClient(c, called);
    if (w){
      fetch('/api/player/bingo', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({userId, cartelaId: c.id})
      }).catch(()=>{});
      return;
    }
  }
}
const autoBtn = document.getElementById('autoBingoBtn');
function updateAutoBingoUI(){ autoBtn.classList.toggle('on', autoBingo); }
updateAutoBingoUI();
autoBtn.onclick = () => {
  autoBingo = !autoBingo;
  localStorage.setItem('autoBingo', autoBingo ? '1' : '0');
  updateAutoBingoUI();
  showToast(autoBingo ? '⚡ Auto-Bingo ON' : 'Auto-Bingo OFF');
  if (autoBingo) checkAutoBingo();
};
function updateBingoBtn(){
  const called = new Set(calledNumbers); called.add(0);
  const has = myCartelas.some(c => evaluateWinClient(c, called));
  const btn = document.getElementById('bingoBtn');
  btn.disabled = !(phase === 'running' && has && !autoBingo);
}

// ============ WINNER MODAL ============
function showWinnerModal(w){
  const div = document.createElement('div');
  div.className = 'modal-bg';
  div.innerHTML = `
    <div class="modal">
      <h1>GAME OVER</h1>
      <div class="winner-badge">🏆 ${w.firstName}</div>
      <div class="pool-label">TOTAL PRIZE</div>
      <div class="pool-amount">${w.prize}<small> ETB</small></div>
    </div>`;
  document.body.appendChild(div);
  fireConfetti();
  playEventAudio(w.firstName + ' won ' + w.prize + ' birr');
  setTimeout(()=>div.remove(), 7500);
}
function fireConfetti(){
  const colors = ['#ec4899','#a855f7','#22d3ee','#facc15','#22c55e','#fb923c'];
  for (let i = 0; i < 70; i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animation = `fall ${2 + Math.random()*2}s linear forwards`;
    c.style.animationDelay = (Math.random()*0.6) + 's';
    c.style.width = (5 + Math.random()*6) + 'px';
    c.style.height = (5 + Math.random()*6) + 'px';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 5000);
  }
}

// ============ TOAST ============
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.innerText = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}

// ============ SOCKETS ============
socket.on('game-state', s => applyState(s));
socket.on('number-called', ({number, all}) => {
  calledNumbers = all;
  setLiveCall(number);
  chime(880, 0.14, 0.08);
  playCall(number);
  renderRecent();
  renderNumberGrid();
  myCartelas.forEach(updateCartelaCells);
  updateProgress();
  updateColumnHighlights();
  updateBingoBtn();
  checkAutoBingo();
});
socket.on('round-finished', w => {
  if (w){ playWinSound(); showWinnerModal(w); }
  myCartelas = [];
  selected = [];
  document.getElementById('cartelasWrap').innerHTML = '';
  document.getElementById('cartelasWrap').dataset.sig = '';
  updateBingoBtn();
});
socket.on('broadcast', ({message}) => { showToast('📢 ' + message); });

// ============ ICON BAR ============
document.getElementById('btnWallet').onclick = () => location.href = '/profile.html?uid=' + userId;
document.getElementById('btnBalance').onclick = async () => {
  try {
    const r = await fetch('/api/profile/' + userId).then(x=>x.json());
    if (r.success){
      showToast(`💰 ${r.user.balance.toFixed(2)} · 🏆 ${r.user.winBalance.toFixed(2)} ETB`);
    }
  } catch(e){}
};
document.getElementById('btnHistory').onclick = () => location.href = '/profile.html?uid=' + userId + '&tab=history';
document.getElementById('btnInvite').onclick = async () => {
  const link = `https://t.me/AbyssinaBingobot?start=${userId}`;
  try { await navigator.clipboard.writeText(link); showToast('🔗 Copied!'); } catch(e){}
  if (navigator.share){
    try { await navigator.share({title:'Abyssinia Bingo', text:'Join me!', url:link}); } catch(e){}
  }
};
document.getElementById('btnLang').onclick = () => showToast('🌐 Language: አማርኛ');
document.getElementById('btnHelp').onclick = () => {
  const ov = document.createElement('div');
  ov.className = 'modal-bg';
  ov.innerHTML = `<div class="modal" style="text-align:left">
    <h1 style="text-align:center">How to Play</h1>
    <p style="font-size:12px;line-height:1.6;color:var(--ink);margin:10px 0">
    Complete <b>one full line</b> — row, column, or diagonal — to win.<br><br>
    ⚡ Turn on Auto-Bingo to claim automatically.<br>
    🔊 Tap Enable Voice to hear every call.<br><br>
    Shortcuts: <b>B</b> Bingo · <b>A</b> Auto · <b>W</b> Wallet · <b>H</b> History · <b>?</b> Help
    </p>
    <button class="action-btn" onclick="this.closest('.modal-bg').remove()">Got it</button>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
};

// ============ KEYBOARD ============
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key.toLowerCase();
  if (k === 'b') tryClaimBingo();
  else if (k === 'a') autoBtn.click();
  else if (k === 'w') document.getElementById('btnWallet').click();
  else if (k === 'h') document.getElementById('btnHistory').click();
  else if (k === '?') document.getElementById('btnHelp').click();
});

// ============ START ============
async function boot(){
  try {
    await Promise.all([loadState(), loadMyCartelas()]);
  } catch(e){
    console.error('boot error:', e);
  } finally {
    // Always hide splash within 3 seconds of page load
    setTimeout(hideSplash, 800);
  }
}
boot();
setInterval(() => { if (socket.connected) loadState(); }, 30000);

// Safety: if boot hangs for any reason, force-hide splash after 6s
