<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Abisinya Bingo</title>
<script src="/socket.io/socket.io.js">
// Tell Telegram to expand to full screen
if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.expand();
  window.Telegram.WebApp.disableVerticalSwipes?.();
  window.Telegram.WebApp.setHeaderColor?.('#0a0f1c');
  window.Telegram.WebApp.setBackgroundColor?.('#0a0f1c');
}
</script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#0a0f1c;color:#fff;font-family:'Segoe UI',sans-serif;padding:10px;overflow-x:hidden}
  .container{max-width:900px;margin:auto}

  /* ===== TOP BAR ===== */
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:6px;
          background:linear-gradient(135deg,#131b2e,#0d1625);padding:10px;border-radius:12px;
          border:1px solid #ffd700;margin-bottom:12px}
  .stat{text-align:center;flex:1}
  .stat small{color:#8b9bb4;font-size:10px;display:block;text-transform:uppercase;letter-spacing:1px}
  .stat b{font-size:16px;display:block}
  .call-box{font-size:44px;font-weight:900;color:#ffd700;text-shadow:0 0 20px #ffd70080;
            min-width:70px;text-align:center;transition:transform .2s}
  .call-box.pop{transform:scale(1.35)}
  .ball{display:inline-block;width:60px;height:60px;line-height:60px;border-radius:50%;
        background:radial-gradient(circle at 30% 30%,#fff,#ffd700 60%,#b8860b);
        color:#000;font-weight:900;font-size:24px;box-shadow:0 0 20px #ffd70080;
        animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 20px #ffd70080}50%{box-shadow:0 0 35px #ffd700cc}}

  /* ===== PHASE BANNER ===== */
  .banner{background:linear-gradient(135deg,#0077b6,#00b4d8);padding:10px 16px;border-radius:10px;
          text-align:center;font-weight:bold;margin-bottom:12px;position:relative}
  .banner.selection{background:linear-gradient(135deg,#f77f00,#e85d04)}
  .banner.running{background:linear-gradient(135deg,#2a9d8f,#0077b6)}
  .banner.finished{background:linear-gradient(135deg,#ffd700,#f77f00);color:#000}
  .banner small{display:block;font-weight:normal;font-size:12px;opacity:.9;margin-top:2px}

  /* ===== COUNTDOWN RING ===== */
  .cd-ring{display:inline-block;width:34px;height:34px;line-height:34px;border-radius:50%;
           background:rgba(0,0,0,.3);font-weight:900;margin-left:8px}

  /* ===== LAST 5 NUMBERS ===== */
  .recent{display:flex;gap:6px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
  .recent .r{width:38px;height:38px;line-height:38px;border-radius:8px;text-align:center;
             font-weight:bold;background:#1f2a3f;font-size:15px;animation:slide-in .3s}
  .recent .r:first-child{background:#2a9d8f;box-shadow:0 0 12px #2a9d8f}
  @keyframes slide-in{from{transform:translateY(-12px);opacity:0}to{transform:translateY(0);opacity:1}}

  /* ===== CARTELA GRID ===== */
  .cartelas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
  .cartela{background:#131b2e;border:2px solid #1f2a3f;border-radius:12px;padding:8px;
           transition:all .3s;position:relative}
  .cartela.has-bingo{border-color:#ffd700;box-shadow:0 0 20px #ffd70080;animation:glow 1s infinite alternate}
  @keyframes glow{from{box-shadow:0 0 15px #ffd70066}to{box-shadow:0 0 30px #ffd700cc}}
  .cartela-id{position:absolute;top:6px;right:10px;font-size:11px;color:#8b9bb4;font-weight:bold}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:18px}
  .hdr{padding:6px 0;text-align:center;font-weight:bold;font-size:13px;border-radius:6px}
  .hdr.b{background:#0077b6}.hdr.i{background:#0096c7}.hdr.n{background:#03045e}
  .hdr.g{background:#f77f00}.hdr.o{background:#d62828}
  .cell{padding:7px 0;text-align:center;font-weight:bold;font-size:15px;border-radius:6px;
        background:#1f2a3f;color:#e0e0e0;min-height:34px;transition:all .3s}
  .cell.free{background:#2a9d8f;font-size:10px;color:#fff}
  .cell.marked{background:#2a9d8f;color:#fff;transform:scale(1.05)}
  .cell.win{background:#ffd700;color:#000;border:2px solid #fff;animation:win-pulse 0.8s infinite alternate}
  @keyframes win-pulse{from{transform:scale(1)}to{transform:scale(1.12)}}

  /* ===== BUTTONS ===== */
  .btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;font-size:15px;
       cursor:pointer;margin-top:8px;background:#0077b6;color:#fff;transition:all .2s}
  .btn.bingo{background:linear-gradient(135deg,#e63946,#c1121f);font-size:18px;padding:14px}
  .btn.bingo:not(:disabled){animation:pulse-btn 1s infinite}
  @keyframes pulse-btn{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
  .btn:disabled{background:#444;cursor:not-allowed;animation:none}

  /* ===== SELECTION SCREEN ===== */
  .select-screen{text-align:center}
  .select-screen h2{color:#ffd700;margin:10px 0}
  .picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;
          max-height:260px;overflow-y:auto;padding:6px;background:#0d1625;border-radius:10px;
          border:1px solid #1f2a3f;margin:12px 0}
  .pick{padding:10px 0;background:#1f2a3f;border:2px solid transparent;border-radius:8px;
        cursor:pointer;font-weight:bold;transition:all .15s;font-size:13px}
  .pick.sel{background:#ffd700;color:#000;border-color:#fff;transform:scale(1.05)}
  .pick.taken{background:#444;color:#888;cursor:not-allowed;text-decoration:line-through}
  .sel-info{font-size:13px;color:#8b9bb4;margin:8px 0}

  /* ===== WINNER MODAL ===== */
  .winner-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;
                justify-content:center;align-items:center;z-index:100;padding:20px}
  .winner-card{background:linear-gradient(135deg,#131b2e,#0d1625);border:3px solid #ffd700;
               border-radius:20px;padding:24px;text-align:center;max-width:400px;width:100%;
               box-shadow:0 0 60px #ffd70080;animation:pop-in .5s}
  @keyframes pop-in{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  .winner-card h1{color:#ffd700;font-size:26px;margin:0 0 12px}
  .winner-name{font-size:24px;font-weight:bold;color:#fff;margin:12px 0}
  .winner-prize{font-size:38px;font-weight:900;color:#00b4d8;margin:12px 0;
                text-shadow:0 0 20px #00b4d880}
  .winner-meta{color:#8b9bb4;font-size:13px;margin-top:8px}

  /* ===== TOASTS ===== */
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
         background:#131b2e;border:2px solid #ffd700;color:#fff;padding:12px 22px;
         border-radius:12px;z-index:99;font-weight:500;animation:toast-in .3s;
         box-shadow:0 0 25px #ffd70040;max-width:90%}
  @keyframes toast-in{from{transform:translate(-50%,30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

  /* ===== CONFETTI ===== */
  .confetti{position:fixed;width:10px;height:10px;top:-20px;z-index:98;pointer-events:none}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="container">

  <!-- ============ SELECTION SCREEN ============ -->
  <div id="selectScreen" class="select-screen" style="display:none">
    <div class="banner selection">
      🎯 ካርቴላ ይምረጡ
      <span class="cd-ring" id="selCd">30</span>
      <small>1 እስከ 4 ካርቴላ መምረጥ ይችላሉ · ዋጋ: <b id="feeTxt">10</b> ብር በአንድ</small>
    </div>
    <div class="sel-info">
      የተመረጡ: <b id="selCount">0</b>/4 · ተጫዋቾች: <b id="pCount">0</b> · ሽልማት: <b id="prizeSel">0</b> ብር
    </div>
    <div class="picker" id="picker"></div>
    <button class="btn" id="joinBtn" disabled>✅ ጨዋታ ተቀላቀል</button>
    <div class="sel-info" id="selMsg" style="margin-top:10px;color:#ffd700"></div>
  </div>

  <!-- ============ GAME SCREEN ============ -->
  <div id="gameScreen" style="display:none">
    <div class="topbar">
      <div class="stat"><small>ቀሪ ሂሳብ</small><b id="balanceLbl">--</b></div>
      <div class="call-box" id="currentCall">--</div>
      <div class="stat"><small>ሽልማት</small><b id="prizeLbl">0</b></div>
    </div>
    <div class="banner running" id="phaseBanner">
      ጨዋታ በሂደት ላይ
      <small>ቁጥሮቹ በራስ-ሰር ይጠራሉ · 4 ማዕዘኖች ሲሟሉ BINGO ይጫኑ</small>
    </div>
    <div class="recent" id="recent"></div>
    <div class="cartelas" id="cartelas"></div>
  </div>
</div>

<script>
// ============ PARAMS ============
const p = new URLSearchParams(location.search);
const userId = Number(p.get('uid')) || 0;
const firstName = p.get('name') || 'Player';
const socket = io();

let availableCartelas = 200;
let fee = 10;
let selected = [];
let myCartelas = [];
let calledNumbers = [];
let phase = 'selection';
let takenSet = new Set();
let lastCall = null;

// ============ INITIAL LOAD ============
async function loadState() {
  const r = await fetch('/api/game').then(x=>x.json());
  availableCartelas = 200;
  fee = r.entryFee;
  document.getElementById('feeTxt').innerText = fee;
  applyState(r);
}
async function loadMyCartelas() {
  const r = await fetch('/api/my-cartelas/' + userId).then(x=>x.json());
  if (r.success && r.cartelas.length) {
    myCartelas = r.cartelas;
    showGameScreen();
    renderCartelas();
  }
}
loadState().then(loadMyCartelas);

// ============ STATE HANDLER ============
function applyState(s) {
  const prevPhase = phase;
  phase = s.phase;
  takenSet = new Set(s.takenCartelas || []);
  calledNumbers = s.calledNumbers || [];
  document.getElementById('prizeLbl').innerText = (s.prizePool || 0) + ' ETB';
  document.getElementById('prizeSel').innerText = s.prizePool || 0;
  document.getElementById('pCount').innerText = s.playerCount || 0;

  if (s.currentCall) {
    setCall(s.currentCall, false);
  }

  if (phase === 'selection') {
    showSelectionScreen();
    startSelectionCountdown(s.selectionEndsAt);
  } else if (phase === 'running') {
    showGameScreen();
    setBanner('running', '🎯 ጨዋታ በሂደት ላይ', 'ቁጥሮቹ በራስ-ሰር ይጠራሉ · 4 ማዕዘኖች ሲሟሉ BINGO ይጫኑ');
  } else if (phase === 'finished') {
    if (prevPhase !== 'finished' && s.winner) showWinner(s.winner);
  }
  renderRecent();
  renderPicker();
  markAll();
}

// ============ COUNTDOWN ============
let cdTimer = null;
function startSelectionCountdown(endsAt) {
  clearInterval(cdTimer);
  const el = document.getElementById('selCd');
  cdTimer = setInterval(() => {
    const left = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
    el.innerText = left;
    if (left <= 0) clearInterval(cdTimer);
  }, 250);
}

// ============ PICKER ============
function renderPicker() {
  const el = document.getElementById('picker');
  if (!el) return;
  el.innerHTML = '';
  // show all 200 with simple virtualization (they're tiny)
  for (let i = 1; i <= availableCartelas; i++) {
    const taken = takenSet.has(i);
    const mine = myCartelas.some(c => c.id === i);
    const sel = selected.includes(i) || mine;
    const d = document.createElement('div');
    d.className = 'pick' + (sel ? ' sel' : '') + (taken && !mine ? ' taken' : '');
    d.innerText = i;
    if (!taken && !mine && phase === 'selection') {
      d.onclick = () => {
        const idx = selected.indexOf(i);
        if (idx >= 0) selected.splice(idx, 1);
        else if (selected.length < 4) selected.push(i);
        else toast('⚠️ ቢበዛ 4 ካርቴላ');
        document.getElementById('selCount').innerText = selected.length;
        document.getElementById('joinBtn').disabled = selected.length === 0;
        renderPicker();
      };
    }
    el.appendChild(d);
  }
}

// ============ SCREENS ============
function showSelectionScreen() {
  document.getElementById('selectScreen').style.display = 'block';
  document.getElementById('gameScreen').style.display = 'none';
}
function showGameScreen() {
  document.getElementById('selectScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
}
function setBanner(cls, title, sub) {
  const b = document.getElementById('phaseBanner');
  b.className = 'banner ' + cls;
  b.innerHTML = title + '<small>' + sub + '</small>';
}

// ============ RENDER CARTELAS ============
function renderCartelas() {
  const wrap = document.getElementById('cartelas');
  wrap.innerHTML = '';
  myCartelas.forEach(c => {
    const card = document.createElement('div');
    card.className = 'cartela';
    card.id = 'cartela-' + c.id;
    card.innerHTML = `<div class="cartela-id">#${c.id}</div>`;
    const grid = document.createElement('div'); grid.className = 'grid';
    ['B','I','N','G','O'].forEach((h,i) => {
      const d = document.createElement('div');
      d.className = 'hdr ' + h.toLowerCase();
      d.innerText = h; grid.appendChild(d);
    });
    for (let r = 0; r < 5; r++) {
      for (let col = 0; col < 5; col++) {
        const n = c.grid[r][col];
        const d = document.createElement('div');
        d.className = 'cell' + (n === 0 ? ' free' : '');
        d.dataset.n = n;
        d.innerText = n === 0 ? 'FREE' : n;
        grid.appendChild(d);
      }
    }
    card.appendChild(grid);
    wrap.appendChild(card);
    checkCartelaBingo(c);
  });
  markAll();
}

function markAll() {
  const set = new Set(calledNumbers); set.add(0);
  document.querySelectorAll('.cell[data-n]').forEach(el => {
    const n = Number(el.dataset.n);
    if (set.has(n)) el.classList.add('marked');
  });
}

function checkCartelaBingo(cartela) {
  const called = new Set(calledNumbers); called.add(0);
  const corners = [cartela.grid[0][0], cartela.grid[0][4], cartela.grid[4][0], cartela.grid[4][4]];
  const ok = corners.every(x => called.has(x));
  const card = document.getElementById('cartela-' + cartela.id);
  if (!card) return;
  if (ok) {
    card.classList.add('has-bingo');
    if (!card.querySelector('.bingo-btn')) {
      const b = document.createElement('button');
      b.className = 'btn bingo bingo-btn';
      b.innerText = '🎉 BINGO!';
      b.onclick = () => claimBingo(cartela.id);
      card.appendChild(b);
    }
  } else {
    card.classList.remove('has-bingo');
    const b = card.querySelector('.bingo-btn');
    if (b) b.remove();
  }
}

// ============ CALLS ============
function setCall(num, animate = true) {
  const el = document.getElementById('currentCall');
  el.innerHTML = `<span class="ball">${num}</span>`;
  if (animate) {
    el.classList.add('pop');
    setTimeout(() => el.classList.remove('pop'), 200);
  }
}
function renderRecent() {
  const el = document.getElementById('recent');
  el.innerHTML = '';
  const last5 = calledNumbers.slice(-5).reverse();
  last5.forEach(n => {
    const d = document.createElement('div');
    d.className = 'r';
    d.innerText = n;
    el.appendChild(d);
  });
}

// ============ ACTIONS ============
document.getElementById('joinBtn').onclick = async () => {
  document.getElementById('selMsg').innerText = 'በመግባት ላይ...';
  const r = await fetch('/api/player/join', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userId, firstName, cartelaIds: selected })
  }).then(x=>x.json());
  if (!r.success) {
    document.getElementById('selMsg').innerText = '❌ ' + r.error;
    return;
  }
  myCartelas = r.cartelas;
  document.getElementById('balanceLbl').innerText = r.balance.toFixed(2) + ' ETB';
  toast('✅ ተቀላቅለዋል! ጨዋታ ሲጀምር ይጠብቁ።');
  showGameScreen();
  renderCartelas();
};

async function claimBingo(cartelaId) {
  const r = await fetch('/api/player/bingo', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userId, cartelaId })
  }).then(x=>x.json());
  if (!r.success) toast('❌ ' + r.error);
}

// ============ WINNER MODAL ============
function showWinner(w) {
  const div = document.createElement('div');
  div.className = 'winner-modal';
  div.innerHTML = `
    <div class="winner-card">
      <h1>🏆 አሸናፊ! 🏆</h1>
      <div class="winner-name">${w.firstName}</div>
      <div class="winner-prize">${w.prize} ETB</div>
      <div class="winner-meta">ካርቴላ #${w.cartelaId} · 4 ማዕዘኖች</div>
      <div class="winner-meta" style="margin-top:12px">ቀጣዩ ዙር በ8 ሰከንድ ይጀምራል...</div>
    </div>`;
  document.body.appendChild(div);
  fireConfetti();
  setTimeout(() => div.remove(), 7500);
}
function fireConfetti() {
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = ['#ffd700','#e63946','#00b4d8','#2a9d8f'][i % 4];
    c.style.animation = `fall ${2 + Math.random() * 2}s linear forwards`;
    c.style.animationDelay = Math.random() + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

// ============ TOASTS ============
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerText = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

// ============ SOCKETS ============
socket.on('game-state', s => applyState(s));

socket.on('number-called', ({ number, all }) => {
  calledNumbers = all;
  setCall(number, true);
  renderRecent();
  markAll();
  myCartelas.forEach(c => checkCartelaBingo(c));
});

socket.on('round-finished', w => {
  if (w) showWinner(w);
  myCartelas = [];
  selected = [];
});

socket.on('broadcast', ({ message }) => toast('📢 ' + message));
</script>
</body>
</html>
